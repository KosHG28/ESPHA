# ===========================================================================
# ESPHA — Waveshare ESP32-S3-Touch-AMOLED-1.43 как панель Home Assistant
#
# Это основной («усыновляемый») конфиг. Прошивка для браузера собирается из
# espha-factory.yaml, который включает этот файл.
#
# Что показывать на экране — меняется в подстановках ниже.
# ===========================================================================

substitutions:
  name: espha
  friendly_name: ESPHA

  # Часовой пояс. Важно задать явно: сборка идёт в GitHub Actions,
  # где системный пояс — UTC.
  timezone: Europe/Moscow

  # На сколько пикселей нужно провести пальцем, чтобы страница пролистнулась
  swipe_threshold: "60"

  # Как часто содержимое сдвигается на пару пикселей против выгорания AMOLED
  pixel_shift_interval: 3min

  # Как часто опрашивается акселерометр и проверяется движение
  imu_poll_interval: 250ms

  # Насколько должен сдвинуться вектор ускорения (в g), чтобы экран проснулся.
  # Значение по умолчанию; на месте подбирается сущностью
  # «Чувствительность к движению» без перепрошивки.
  motion_wake_threshold: "0.12"

  # Скорость шины дисплея. 40MHz — если на 80MHz появятся артефакты
  display_data_rate: 80MHz

  # Буфер отрисовки LVGL в процентах экрана. Если после перехода на 25%
  # интерфейс стал медленнее — верните 100%
  lvgl_buffer_size: 25%

  # Цвет минут на часах. Часы белые, минуты — этим цветом: без двоеточия
  # так легче читать время
  time_minutes_color: "0x8FB3CC"

  # Цвет температуры: ниже slotN_cold — холодный цвет, выше slotN_hot —
  # тёплый, между ними белый. slot1 — на улице, slot2 — в комнате
  slot1_cold: "0"
  slot1_hot: "25"
  slot2_cold: "20"
  slot2_hot: "26"
  temp_cold_color: "0x7CC4FF"
  temp_hot_color: "0xFFA040"

  # Входная дверь: пока открыта (on), на часах горит значок
  door_entity: binary_sensor.vhoddver_contact
  # Через сколько открытой двери значок краснеет, мигает и будит экран
  door_alarm_delay: 1min

  # Выключение экрана. Ночные часы по умолчанию — дальше их меняют
  # сущности «Ночь: гасить экран с / до» в Home Assistant
  night_off_from: "1"
  night_off_to: "6"
  # Сколько ждать после того, как дома никого не осталось (zone.home = 0)
  away_off_delay: 10min

  # Сколько секунд показывать сообщение из Home Assistant
  message_seconds: "25"

  # Через сколько секунд без касаний прятать точки страниц
  page_dots_timeout: 5s

  # Длительность анимации листания. Держим короткой: перерисовка кадра на
  # этой плате не бесплатна. 0ms полностью отключает анимацию.
  page_anim_time: 120ms

  # ---- Данные из Home Assistant ------------------------------------------
  # slotN_entity — entity_id числовой сущности (sensor.*)
  # slotN_title  — подпись на экране
  # slotN_format — формат printf для значения (%f — само значение)
  slot1_entity: sensor.yandex_pogoda_temperature
  slot1_title: "На улице"
  slot1_format: "%.1f°"

  slot2_entity: sensor.0xa4c138e62d2c9de0_temperature
  slot2_title: "В комнате"
  slot2_format: "%.1f°"


  # ---- 3D-принтер Bambu Lab ----------------------------------------------
  # Сущности создаёт интеграция Bambu Lab (HACS, greghesp/ha-bambulab),
  # она же работает в LAN-режиме. Ниже — Bambu Lab X1C, серийный номер
  # 00M09A391500084. Для другого принтера посмотрите точные entity_id
  # в Инструменты разработчика → Состояния.
  printer_progress_entity: sensor.x1c_00m09a391500084_print_progress
  printer_status_entity: sensor.x1c_00m09a391500084_print_status
  printer_nozzle_entity: sensor.x1c_00m09a391500084_nozzle_temperature
  printer_bed_entity: sensor.x1c_00m09a391500084_bed_temperature
  printer_layer_entity: sensor.x1c_00m09a391500084_current_layer
  printer_total_layers_entity: sensor.x1c_00m09a391500084_total_layer_count
  printer_remaining_entity: sensor.x1c_00m09a391500084_remaining_time
  # Подробная стадия и признаки ошибок — по ним кольцо меняет цвет
  printer_stage_entity: sensor.x1c_00m09a391500084_current_stage
  printer_error_entity: binary_sensor.x1c_00m09a391500084_print_error
  printer_hms_entity: binary_sensor.x1c_00m09a391500084_hms_errors

  # Период кадра пульсации кольца. Больше — дешевле для процессора,
  # но пульсация становится заметно ступенчатой.
  printer_anim_interval: 80ms

  # ---- Обновление прошивки ----------------------------------------------
  # Откуда Home Assistant берёт новые сборки. Это манифест, который GitHub
  # Actions публикует вместе со страницей установки
  firmware_manifest_url: https://koshg28.github.io/ESPHA/firmware/manifest.json

  # ---- Погода на фоне -----------------------------------------------------
  # Сущность с состоянием погоды: rain, light_snow, sleet и т. д. Во время
  # дождя или снега на странице часов идут капли или снежинки.
  # Включить, выключить или проверить эффект — сущностью «Фон погоды».
  weather_condition_entity: sensor.yandex_pogoda_condition_yandex
  # Ветер: скорость в м/с и направление в градусах (откуда дует).
  # Если таких сущностей нет, дождь и снег просто идут без сноса
  weather_wind_speed_entity: sensor.yandex_pogoda_wind_speed
  weather_wind_bearing_entity: sensor.yandex_pogoda_wind_bearing
  # Порывы ветра, м/с. Время от времени снос на пару секунд усиливается до них
  weather_wind_gust_entity: sensor.yandex_pogoda_wind_gust

  # Период кадра погодного фона — в такт с обновлением экрана
  # (lvgl_refresh_interval), иначе движение неровное. 16ms — 60 кадров в
  # секунду. Скорость частиц от него не зависит: она считается по реально
  # прошедшему времени
  weather_fx_interval: 16ms
  # Как часто LVGL проверяет, что перерисовать. Перерисовываются только
  # изменившиеся участки, так что в покое это почти ничего не стоит
  lvgl_refresh_interval: 16ms

  # Во что перевести значение «остатка времени», чтобы получить минуты.
  # У этой установки сущность в минутах — поэтому 1. Если в Home Assistant
  # она показывается в часах (единица h), поставьте 60.
  printer_remaining_to_minutes: "1"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.7.0
  project:
    name: koshg28.espha
    version: "1.0.0"
  platformio_options:
    build_flags:
      # Сколько изменённых участков экрана LVGL запоминает за кадр. По
      # умолчанию 32, а при переполнении он перерисовывает ВЕСЬ экран. Каждая
      # сдвинутая капля даёт два участка (где была и где стала), так что
      # дождь с брызгами переполнял лимит почти каждый кадр: экран целиком
      # перерисовывался ~15 раз в секунду и капли мерцали. 128 хватает на все
      # частицы погоды сразу
      - -DLV_INV_BUF_SIZE=128
  on_boot:
    - priority: -100
      then:
        - script.execute: wake_screen
        - script.execute: refresh_clock
        - component.update: i2c_devices
        # Заставку прячет подключение к HA; без HA — через минуту, часы идут по RTC
        - script.execute: splash_timeout
        - lvgl.arc.update:
            id: arc_bright
            value: !lambda 'return (int) id(screen_brightness).state;'
        - lvgl.label.update:
            id: lbl_bright
            text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", (int) id(screen_brightness).state);
              return std::string(buf);

# Свой драйвер тачскрина FT3168 — штатные драйверы ESPHome с этим чипом
# не работают, подробности в packages/hardware.yaml.
#
# Источник именно git, а не local: путь у local считается от каталога
# конфигурации ESPHome, а не от скачанного пакета, поэтому при импорте этого
# репозитория в Home Assistant он искал бы /config/esphome/components.
external_components:
  - source: github://koshg28/ESPHA@main
    components: [ft3168, weather_fx]

packages:
  hardware: !include packages/hardware.yaml
  screen: !include packages/screen.yaml
  entities: !include packages/entities.yaml
  printer: !include packages/printer.yaml
  weather: !include packages/weather.yaml
  message: !include packages/message.yaml
  ui: !include packages/ui.yaml
  imu: !include packages/imu.yaml
  behaviour: !include packages/behaviour.yaml

logger:
  level: INFO
  # У платы нет USB-UART моста: консоль идёт через встроенный USB-Serial/JTAG
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome
  # Обновление по воздуху с GitHub Pages — через сущность «Прошивка» ниже
  - platform: http_request

# Для загрузки манифеста и прошивки с GitHub Pages
http_request:
  timeout: 15s

# Сущность «Прошивка» в Home Assistant: раз в 6 часов проверяет, не вышла ли
# новая сборка, и ставит её по кнопке «Установить» — без браузера и кабеля
update:
  - platform: http_request
    id: firmware_update
    name: Прошивка
    source: ${firmware_manifest_url}
    update_interval: 6h

wifi:
  # Без энергосбережения данные из Home Assistant доходят без задержки.
  # Плата обычно питается от USB, так что расход не важен.
  power_save_mode: none
  on_connect:
    - lvgl.label.update:
        id: splash_text
        text: "Подключение к Home Assistant..."
  # Точка доступа-запаска, если сохранённая сеть недоступна
  ap:

captive_portal:

# Позволяет задать Wi-Fi прямо из браузера сразу после прошивки
improv_serial:

dashboard_import:
  package_import_url: github://koshg28/ESPHA/espha.yaml@main
  import_full_config: false
