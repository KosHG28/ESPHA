# Готовый стек для Dockge (или Portainer): вставить целиком в «+ Compose»,
# поменять координаты и нажать «Развернуть». Файлы сервера скачиваются
# с GitHub при сборке — копировать ничего не нужно.
#
# Порт на хосте — 8088: 8080 на этом сервере обычно занят (qBittorrent).
# В Home Assistant у платы: «Адрес сервера радара» = http://IP_ХОСТА:8088
services:
  radar:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN apt-get update \
            && apt-get install -y --no-install-recommends fonts-dejavu-core \
            && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir "FlightRadarAPI>=1.3.0" "Pillow>=10.0"
        WORKDIR /app
        ADD https://raw.githubusercontent.com/KosHG28/ESPHA/main/server/radar/radar_server.py ./
        ADD https://raw.githubusercontent.com/KosHG28/ESPHA/main/server/radar/cities.json ./
        ENV PYTHONUNBUFFERED=1 CACHE_DIR=/data
        CMD ["python", "radar_server.py"]
    image: espha-radar:latest
    # Образ только свой — не искать его в Docker Hub
    pull_policy: build
    container_name: espha-radar
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      # Центр радара — ваш дом
      CENTER_LAT: "55.7558"
      CENTER_LON: "37.6173"
      # Карта платы: dark — тёмная Esri, sat — спутник, osm-dark — тёмная
      # OpenStreetMap, osm — светлая OpenStreetMap. Все без ключей API
      MAP_STYLE: "dark"
      # Яркость карты: 1.0 — как у источника, больше — светлее
      MAP_BRIGHTNESS: "1.15"
      TZ: Europe/Moscow
    volumes:
      # Кэш тайлов и готовых карт
      - ./data:/data
