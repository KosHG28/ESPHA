services:
  radar:
    build: .
    container_name: espha-radar
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Центр радара — ваш дом. Сами координаты — в файле .env рядом со стеком
      # (в Dockge — поле «.env» под compose), чтобы их не было в GitHub:
      #   CENTER_LAT=55.7558
      #   CENTER_LON=37.6173
      CENTER_LAT: ${CENTER_LAT:-}
      CENTER_LON: ${CENTER_LON:-}
      # Карта платы: dark — тёмная Esri, sat — спутник, osm-dark — тёмная
      # OpenStreetMap, osm — светлая OpenStreetMap. Все без ключей API
      MAP_STYLE: "dark"
      # Яркость карты: 1.0 — как у источника, больше — светлее
      MAP_BRIGHTNESS: "1.15"
      TZ: Europe/Moscow
    volumes:
      # Кэш тайлов и готовых карт — чтобы не качать их заново после перезапуска
      - ./data:/data
