# ===========================================================================
# Прошивка для установки из браузера (ESP Web Tools).
#
# Отличается от espha.yaml только тем, что к имени устройства добавляется
# суффикс из MAC-адреса — чтобы несколько плат не конфликтовали в сети.
# ===========================================================================

packages:
  base: !include espha.yaml

esphome:
  name_add_mac_suffix: true
