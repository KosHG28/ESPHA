# ---------------------------------------------------------------------------
# Пасхалки: изредка, раз в 1–3 часа, на экран выходит гость — на любой
# странице, в том числе в приглушённом режиме (но не когда экран погашен
# совсем):
#   - кот пробегает внизу; иногда добегает до середины, садится, моргает и
#     убегает обратно;
#   - птица пролетает по верху;
#   - улитка медленно ползёт по низу, а зимой вместо неё проходит снеговик;
#   - ночью кот может прийти поспать — свернётся внизу, над ним «z z z».
# В Новый год (15.12–14.01) и в дни рождения приходит только кот — чаще, раз в
# 30–60 минут, и в праздничном колпаке.
#
# Кот и погода: в дождь пробегает под зонтиком; в снег садится посередине и
# ловит лапой снежинку; ясной ночью иногда садится и смотрит в небо — и там
# пролетает метеор. Когда печать закончилась, кот прибегает посмотреть на
# принтер и мурчит.
# Позвать кота: кнопка «Позвать кота» в Home Assistant или пять быстрых
# касаний по странице часов. Любого гостя — выбор «Позвать гостя».
#
# Сезонные гости: ночью вместо птицы прилетает сова и сидит на ветке у края,
# летом днём иногда порхает бабочка, осенью вместо улитки идёт ёжик с листом
# на спине, на Хэллоуин (31 октября) внизу стоит тыква с мерцающими глазами.
#
# Анимацию ведёт компонент components/critters (C++), спрайты рисует
# tools/make_sprites.py. Гость — одна маленькая картинка, так что за кадр
# перерисовывается только участок вокруг неё.
# ---------------------------------------------------------------------------

critters:
  id: crit

globals:
  # Секретный вызов: сколько касаний подряд и когда было первое
  - id: tap_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: tap_first_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

interval:
  # Состояние для гостей (экран, ночь, погода, праздник). Кадры анимации идут
  # в таймере LVGL, по одному на перерисовку экрана
  - interval: 100ms
    then:
      - lambda: |-
          static bool bound = false;
          if (!bound) {
            bound = true;
            // Картинка гостя и «z z z» — на верхнем слое, поверх любой страницы
            lv_obj_t *top = lv_display_get_layer_top(lv_display_get_default());
            lv_obj_t *img = lv_image_create(top);
            lv_obj_add_flag(img, LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(img, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_t *zzz = lv_label_create(top);
            lv_obj_set_style_text_font(zzz, id(font_l)->get_lv_font(), 0);
            lv_obj_set_style_text_color(zzz, lv_color_hex(0x8FB3CC), 0);
            lv_obj_add_flag(zzz, LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(zzz, LV_OBJ_FLAG_CLICKABLE);
            // Колпак или зонтик — поверх кота; снежинка, которую он ловит
            lv_obj_t *hat = lv_image_create(top);
            lv_obj_add_flag(hat, LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(hat, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_t *item = lv_image_create(top);
            lv_obj_add_flag(item, LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(item, LV_OBJ_FLAG_CLICKABLE);
            id(crit)->bind(img, zzz, hat, item);
          }
          // Зима ли — достаточно проверять раз в минуту
          static bool winter = false;
          static uint32_t checked = 0;
          if (checked == 0 || millis() - checked > 60000) {
            checked = millis();
            auto now = id(ha_time).now();
            winter = now.is_valid() && (now.month == 12 || now.month <= 2);
            if (now.is_valid())
              id(crit)->set_date(now.month, now.day_of_month);
          }
          id(crit)->set_festive(id(festive_day));
          // Дождь, мокрый снег и град — кот под зонтиком; снег — ловит снежинку
          const int m = id(weather_mode);
          id(crit)->set_weather(m == 1 || m == 3 || m == 4 ? 1 : (m == 2 ? 2 : 0), id(weather_stars));
          id(crit)->set_state(!id(screen_off), id(is_night), winter);

select:
  # Позвать любого гостя сейчас — посмотреть, не дожидаясь случая
  - platform: template
    id: guest_select
    name: Позвать гостя
    icon: mdi:paw
    options: ["—", "Кот", "Птица", "Улитка", "Снеговик", "Сова", "Бабочка", "Ёжик", "Тыква"]
    initial_option: "—"
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: 'return i > 0;'
          then:
            - script.execute: wake_screen
            - lambda: |-
                using namespace critters;
                static const Show SHOWS[] = {SHOW_NONE, SHOW_CAT_RUN, SHOW_BIRD, SHOW_SNAIL, SHOW_SNOWMAN,
                                             SHOW_OWL, SHOW_BUTTERFLY, SHOW_HEDGEHOG, SHOW_PUMPKIN};
                if (i == 1)
                  id(crit)->start_cat();
                else if (i < sizeof(SHOWS) / sizeof(SHOWS[0]))
                  id(crit)->start(SHOWS[i]);
            - select.set:
                id: guest_select
                option: "—"

button:
  - platform: template
    name: Позвать кота 🐈
    icon: mdi:cat
    on_press:
      - script.execute: wake_screen
      - lambda: 'id(crit)->start_cat();'
