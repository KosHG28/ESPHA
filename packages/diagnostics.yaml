# ---------------------------------------------------------------------------
# Диагностика производительности и стабильности — в Home Assistant.
#
# «Время цикла» — самый полезный датчик: сколько миллисекунд занял самый
# долгий проход основного цикла прошивки за последние 10 секунд. Чем больше,
# тем дольше плата не успевает ответить на касание. Сравнивайте его при
# включённом и выключенном «Фоне погоды», до и после правок.
# ---------------------------------------------------------------------------

debug:
  update_interval: 10s

sensor:
  - platform: debug
    loop_time:
      name: Время цикла
      entity_category: diagnostic
    # Свободная внутренняя память — если она со временем только убывает,
    # где-то утечка
    free:
      name: Свободно памяти
      entity_category: diagnostic
    block:
      name: Крупнейший свободный блок
      entity_category: diagnostic
    psram:
      name: Свободно PSRAM
      entity_category: diagnostic

text_sensor:
  # Если плата перезагрузилась сама — здесь будет видно почему
  - platform: debug
    reset_reason:
      name: Причина перезагрузки
      entity_category: diagnostic
