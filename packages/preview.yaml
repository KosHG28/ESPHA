# ---------------------------------------------------------------------------
# Превью печатаемой модели.
#
# Интеграция Bambu Lab публикует картинку текущей модели как сущность
# image.<принтер>_cover_image. В её атрибуте entity_picture лежит относительная
# ссылка вида /api/image_proxy/image.x?token=... — токен уже внутри, логин
# не нужен. Устройство дописывает к ней адрес Home Assistant (ha_url)
# и скачивает PNG. Токен HA периодически меняет, атрибут обновляется,
# и ссылка перезадаётся сама.
#
# Если ha_url неверный или HA недоступен по HTTP — на странице будет надпись
# «нет превью», остальное продолжит работать.
# ---------------------------------------------------------------------------

http_request:
  id: http_client
  timeout: 10s

image:
  - platform: online_image
    id: printer_preview
    # Стартовая ссылка не важна — её сразу заменит entity_picture
    url: "${ha_url}/api/image_proxy/${printer_cover_entity}"
    format: PNG
    type: RGB565
    resize: 400x400
    on_download_finished:
      - lvgl.image.update:
          id: img_preview
          src: printer_preview
      - lvgl.widget.hide: lbl_preview_note
    on_error:
      - lvgl.label.update:
          id: lbl_preview_note
          text: "нет превью"
      - lvgl.widget.show: lbl_preview_note

text_sensor:
  - platform: homeassistant
    id: ha_printer_cover_url
    entity_id: ${printer_cover_entity}
    attribute: entity_picture
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return !x.empty();'
          then:
            - online_image.set_url:
                id: printer_preview
                url: !lambda |-
                  // Обычно ссылка относительная; абсолютную оставляем как есть
                  if (x.rfind("http://", 0) == 0 || x.rfind("https://", 0) == 0)
                    return x;
                  return std::string("${ha_url}") + x;
                update: true
