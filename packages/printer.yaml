# ---------------------------------------------------------------------------
# Страница 3D-принтера Bambu Lab.
#
# Данные берутся из интеграции Bambu Lab (HACS, greghesp/ha-bambulab) —
# она работает и в LAN-режиме, без облака. Имена сущностей задаются
# подстановками printer_*_entity в espha.yaml.
#
# Кольцо показывает не только прогресс, но и фазу работы принтера: его цвет
# зависит от того, что принтер сейчас делает. Идея подсмотрена в проекте
# PrintSphere-Display (cptkirki), реализация своя.
#
# Пульсирует не кольцо, а подпись стадии под процентом. Кольцо 436×436 при
# каждом кадре перерисовывало почти весь экран; подпись — в десятки раз
# меньшая площадь.
#
# Фазы (глобальная printer_phase):
#   0 ожидание      — серое кольцо
#   1 печать        — зелёное
#   2 готово        — зелёное; при переходе в эту фазу — вспышка «ГОТОВО»
#   3 ошибка        — красное, подпись пульсирует; при переходе — «ОШИБКА»
#   4 пауза         — янтарное, подпись пульсирует
#   5 нагрев        — оранжевое, подпись пульсирует
#   6 очистка сопла — белое, подпись пульсирует
#   7 калибровка    — фиолетовое, подпись пульсирует
#   8 подготовка    — оранжевое, подпись пульсирует
#   9 загрузка филамента  — жёлтое
#  10 выгрузка филамента  — жёлтое
#
# В простое (ожидание, готово, нет связи) слой и остаток времени скрыты,
# а вместо них показано, когда закончилась последняя печать.
# ---------------------------------------------------------------------------

globals:
  - id: printer_phase
    type: int
    restore_value: false
    initial_value: '0'
  - id: printer_prev_phase
    type: int
    restore_value: false
    initial_value: '0'
  # Вспышки разрешены только спустя время после подключения к Home Assistant.
  # При подключении HA заново присылает все текущие состояния, и без этой
  # задержки законченная час назад печать снова вызывала бы «ГОТОВО».
  - id: printer_armed
    type: bool
    restore_value: false
    initial_value: 'false'
  # Когда закончилась последняя печать (секунды с 1970-го), 0 — неизвестно.
  # Сохраняется во флеш: пишется раз за печать, это не изнашивает память.
  # Идёт ли сейчас печать (включая нагрев, калибровку и паузу). По смене
  # этого флага ловится начало печати. Загрузка филамента его не меняет —
  # иначе каждая смена цвета в AMS считалась бы новой печатью
  - id: printer_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: printer_was_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: printer_last_finish
    type: uint32_t
    restore_value: true
    initial_value: '0'

sensor:
  - platform: homeassistant
    id: ha_printer_progress
    entity_id: ${printer_progress_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_print_pct
          text: !lambda |-
            if (std::isnan(x))
              return std::string("--");
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", (int) x);
            return std::string(buf);
      - script.execute: update_printer_phase

  - platform: homeassistant
    id: ha_printer_nozzle
    entity_id: ${printer_nozzle_entity}
    internal: true
    # Во время печати температура приходит каждую секунду; перерисовываем,
    # только когда она сдвинулась хотя бы на градус
    filters:
      - delta: 1.0
    on_value:
      - lvgl.label.update:
          id: lbl_print_nozzle
          text: !lambda |-
            char buf[24];
            if (std::isnan(x))
              snprintf(buf, sizeof(buf), "\U000F0E5B --");
            else
              snprintf(buf, sizeof(buf), "\U000F0E5B %.0f°", x);
            return std::string(buf);

  - platform: homeassistant
    id: ha_printer_bed
    entity_id: ${printer_bed_entity}
    internal: true
    filters:
      - delta: 1.0
    on_value:
      - lvgl.label.update:
          id: lbl_print_bed
          text: !lambda |-
            char buf[24];
            if (std::isnan(x))
              snprintf(buf, sizeof(buf), "\U000F1A45 --");
            else
              snprintf(buf, sizeof(buf), "\U000F1A45 %.0f°", x);
            return std::string(buf);

  - platform: homeassistant
    id: ha_printer_layer
    entity_id: ${printer_layer_entity}
    internal: true
    on_value:
      - script.execute: refresh_printer_layers

  - platform: homeassistant
    id: ha_printer_total_layers
    entity_id: ${printer_total_layers_entity}
    internal: true
    on_value:
      - script.execute: refresh_printer_layers

  - platform: homeassistant
    id: ha_printer_remaining
    entity_id: ${printer_remaining_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_print_eta
          text: !lambda |-
            if (std::isnan(x))
              return std::string("\U000F0150 --");
            // Интеграция отдаёт время в часах; множитель задаётся подстановкой
            int total = (int) (x * ${printer_remaining_to_minutes} + 0.5f);
            char buf[24];
            if (total < 60)
              snprintf(buf, sizeof(buf), "\U000F0150 %dм", total);
            else
              snprintf(buf, sizeof(buf), "\U000F0150 %dч %02dм", total / 60, total % 60);
            return std::string(buf);

text_sensor:
  - platform: homeassistant
    id: ha_printer_status
    entity_id: ${printer_status_entity}
    internal: true
    on_value:
      - script.execute: update_printer_phase

  # Стадия подробнее статуса: «нагрев стола», «очистка сопла» и т. д.
  - platform: homeassistant
    id: ha_printer_stage
    entity_id: ${printer_stage_entity}
    internal: true
    on_value:
      - script.execute: update_printer_phase

binary_sensor:
  - platform: homeassistant
    id: ha_printer_error
    entity_id: ${printer_error_entity}
    internal: true
    on_state:
      - script.execute: update_printer_phase

  # HMS — системные сообщения принтера. Среди них бывают и безобидные
  # предупреждения, которые висят и во время печати, и после неё. Поэтому
  # ошибкой HMS считается только на паузе — когда принтер из-за неё встал.
  - platform: homeassistant
    id: ha_printer_hms
    entity_id: ${printer_hms_entity}
    internal: true
    on_state:
      - script.execute: update_printer_phase

script:
  - id: refresh_printer_layers
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_print_layer
          text: !lambda |-
            float cur = id(ha_printer_layer).state;
            float tot = id(ha_printer_total_layers).state;
            if (std::isnan(cur) || std::isnan(tot))
              return std::string("\U000F0F58 --");
            char buf[32];
            snprintf(buf, sizeof(buf), "\U000F0F58 %d / %d", (int) cur, (int) tot);
            return std::string(buf);

  # «закончилась в 14:32» / «последняя печать вчера в 14:32».
  # Вызывается при смене фазы и раз в минуту из refresh_clock, чтобы
  # «сегодня» в полночь превращалось во «вчера»
  - id: refresh_printer_last
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_print_last
          text: !lambda |-
            uint32_t ts = id(printer_last_finish);
            if (ts == 0)
              return std::string("");
            auto now = id(ha_time).now();
            auto t = ESPTime::from_epoch_local(ts);
            const char *prefix = id(printer_phase) == 2 ? "закончилась" : "последняя печать";
            char buf[96];
            if (now.is_valid() && t.year == now.year && t.day_of_year == now.day_of_year) {
              snprintf(buf, sizeof(buf), "%s в %02d:%02d", prefix, t.hour, t.minute);
            } else {
              auto y = ESPTime::from_epoch_local(now.timestamp - 86400);
              if (now.is_valid() && t.year == y.year && t.day_of_year == y.day_of_year)
                snprintf(buf, sizeof(buf), "%s вчера в %02d:%02d", prefix, t.hour, t.minute);
              else
                snprintf(buf, sizeof(buf), "%s %02d.%02d в %02d:%02d", prefix, t.day_of_month,
                         t.month, t.hour, t.minute);
            }
            return std::string(buf);

  # Разрешить вспышки через некоторое время после подключения к HA —
  # когда начальный поток состояний уже пришёл
  # Показать страницу принтера и разбудить экран. Через 2 минуты — обратно
  # на часы, если пользователь сам ничего не листал (касание и кнопка BOOT
  # останавливают этот скрипт). При обычном таймауте гашения экран вернётся
  # на часы ещё раньше
  - id: printer_focus
    mode: restart
    then:
      # Экран выключен (ночь или никого нет) — не будить, а открыть страницу
      # принтера, когда экран включат
      - if:
          condition:
            lambda: 'return id(screen_off);'
          then:
            - lambda: 'id(printer_pending) = true;'
            - script.stop: printer_focus
      - if:
          condition:
            lambda: 'return id(current_page) != 2;'
          then:
            - lvgl.page.show:
                id: page_printer
      - script.execute: wake_screen
      - delay: 2min
      - if:
          condition:
            lambda: 'return id(current_page) == 2;'
          then:
            - lvgl.page.show:
                id: page_clock

  - id: printer_arm
    mode: restart
    then:
      - lambda: 'id(printer_armed) = false;'
      - delay: 20s
      - lambda: 'id(printer_armed) = true;'

  # Пересчитать фазу принтера по статусу, стадии, прогрессу и ошибкам,
  # обновить подпись и кольцо, отреагировать на переходы в «готово» и «ошибку»
  - id: update_printer_phase
    mode: queued
    max_runs: 3
    then:
      - lambda: |-
          const std::string &ps = id(ha_printer_status).state;
          const std::string &st = id(ha_printer_stage).state;
          float pr = id(ha_printer_progress).state;
          bool perr = id(ha_printer_error).has_state() && id(ha_printer_error).state;
          bool hms = id(ha_printer_hms).has_state() && id(ha_printer_hms).state;
          auto starts = [](const std::string &s, const char *p) { return s.rfind(p, 0) == 0; };

          int ph;
          if (st == "filament_loading")
            ph = 9;
          else if (st == "filament_unloading")
            ph = 10;
          // «Готово» строго: статус finish И прогресс дошёл до 100. Проверяется
          // раньше ошибок: после печати флаги ошибок и HMS могут остаться
          // висеть, и законченная печать показывалась бы как «ошибка»
          else if (ps == "finish" && !std::isnan(pr) && pr >= 100)
            ph = 2;
          else if (ps == "failed" || (perr && (ps == "running" || ps == "pause" || ps == "prepare")) ||
                   (hms && ps == "pause"))
            ph = 3;
          else if (ps == "pause" || starts(st, "paused"))
            ph = 4;
          else if (st == "heatbed_preheating" || st == "heating_hotend" || st == "heating_chamber" ||
                   st == "waiting_for_heatbed_temperature")
            ph = 5;
          else if (st == "cleaning_nozzle_tip")
            ph = 6;
          else if (st == "auto_bed_leveling" || starts(st, "bed_level"))
            ph = 7;
          else if (ps == "prepare" || ps == "slicing" || ps == "init")
            ph = 8;
          else if (ps == "running")
            ph = 1;
          else
            ph = 0;

          id(printer_prev_phase) = id(printer_phase);
          id(printer_phase) = ph;
          id(printer_was_active) = id(printer_active);
          if (ph == 1 || (ph >= 4 && ph <= 8))
            id(printer_active) = true;
          else if (ph == 0 || ph == 2 || ph == 3)
            id(printer_active) = false;

      # Подпись: сначала конкретная стадия, если она известна, иначе статус
      - lvgl.label.update:
          id: lbl_print_status
          text: !lambda |-
            const std::string &st = id(ha_printer_stage).state;
            const std::string &ps = id(ha_printer_status).state;
            switch (id(printer_phase)) {
              case 2: return std::string("готово");
              case 3: return std::string("ошибка");
              case 9: return std::string("загрузка филамента");
              case 10: return std::string("выгрузка филамента");
            }
            if (st == "heatbed_preheating" || st == "waiting_for_heatbed_temperature")
              return std::string("нагрев стола");
            if (st == "heating_hotend") return std::string("нагрев сопла");
            if (st == "heating_chamber") return std::string("нагрев камеры");
            if (st == "cleaning_nozzle_tip") return std::string("очистка сопла");
            if (st == "auto_bed_leveling" || st.rfind("bed_level", 0) == 0)
              return std::string("калибровка стола");
            if (st == "changing_filament") return std::string("смена филамента");
            if (st == "paused_filament_runout") return std::string("кончился филамент");
            if (st.rfind("paused", 0) == 0) return std::string("пауза");
            if (ps == "running") return std::string("печать");
            if (ps == "idle") return std::string("ожидание");
            if (ps == "prepare") return std::string("подготовка");
            if (ps == "slicing") return std::string("нарезка");
            if (ps == "init") return std::string("запуск");
            if (ps == "pause") return std::string("пауза");
            if (ps == "finish") return std::string("завершено");
            if (ps == "offline") return std::string("нет связи");
            return ps.empty() ? std::string("--") : ps;

      # Цвет кольца — сплошной по фазе, ставится один раз при смене фазы
      - lvgl.arc.update:
          id: arc_print
          value: !lambda |-
            float pr = id(ha_printer_progress).state;
            return std::isnan(pr) ? 0 : (int) pr;
          indicator:
            arc_color: !lambda |-
              switch (id(printer_phase)) {
                case 1:
                case 2: return lv_color_hex(0x22DD44);
                case 3: return lv_color_hex(0xFF3333);
                case 4: return lv_color_hex(0xFFB300);
                case 5:
                case 8: return lv_color_hex(0xFF8A00);
                case 6: return lv_color_hex(0xDDDDDD);
                case 7: return lv_color_hex(0xAA66FF);
                case 9:
                case 10: return lv_color_hex(0xFFD54F);
                default: return lv_color_hex(0x555C63);
              }

      # Цвет подписи стадии. Для пульсирующих фаз это стартовое значение,
      # дальше его ведёт интервал ниже
      - lvgl.widget.update:
          id: lbl_print_status
          text_color: !lambda |-
            switch (id(printer_phase)) {
              case 2: return lv_color_hex(0x22DD44);
              case 3: return lv_color_hex(0xFF3333);
              case 4: return lv_color_hex(0xFFB300);
              case 5:
              case 8: return lv_color_hex(0xFF8A00);
              case 6: return lv_color_hex(0xFFFFFF);
              case 7: return lv_color_hex(0xAA66FF);
              case 9:
              case 10: return lv_color_hex(0xFFD54F);
              default: return lv_color_hex(0x8A9199);
            }

      # Простой или печать: какие строки на экране осмысленны
      - if:
          condition:
            lambda: 'return id(printer_phase) == 0 || id(printer_phase) == 2;'
          then:
            - lvgl.widget.update:
                id: [lbl_print_layer, lbl_print_eta]
                hidden: true
            - lvgl.widget.update:
                id: lbl_print_last
                hidden: false
          else:
            - lvgl.widget.update:
                id: [lbl_print_layer, lbl_print_eta, lbl_print_pct]
                hidden: false
            - lvgl.widget.update:
                id: lbl_print_last
                hidden: true
      # В ожидании процент прошлой печати только путает
      - lvgl.widget.update:
          id: lbl_print_pct
          hidden: !lambda 'return id(printer_phase) == 0;'
      - script.execute: refresh_printer_last

      # Вспышки — только на переходе в фазу и только после «взвода»
      - if:
          condition:
            lambda: |-
              return id(printer_armed) && id(printer_phase) == 2 && id(printer_prev_phase) != 2;
          then:
            - lambda: |-
                auto now = id(ha_time).now();
                if (now.is_valid())
                  id(printer_last_finish) = (uint32_t) now.timestamp;
            - script.execute: refresh_printer_last
            - script.execute: printer_focus
            - script.execute:
                id: flash_screen
                color: !lambda 'return 0x22DD44;'
                text: !lambda 'return "ГОТОВО";'
      - if:
          condition:
            lambda: |-
              return id(printer_armed) && id(printer_phase) == 3 && id(printer_prev_phase) != 3;
          then:
            - script.execute: printer_focus
            - script.execute:
                id: flash_screen
                color: !lambda 'return 0xE53935;'
                text: !lambda 'return "ОШИБКА";'
      # Печать началась или встала на паузу — показать страницу принтера
      # без вспышки
      - if:
          condition:
            lambda: |-
              if (!id(printer_armed))
                return false;
              bool started = id(printer_active) && !id(printer_was_active);
              bool paused = id(printer_phase) == 4 && id(printer_prev_phase) != 4;
              return started || paused;
          then:
            - script.execute: printer_focus

interval:
  # Пульсация подписи стадии. Работает только когда страница принтера на
  # экране и фаза действительно пульсирующая. Подпись яркая и тусклая по
  # синусу — цвет не уходит в чёрный, чтобы текст оставался читаемым.
  - interval: ${printer_anim_interval}
    then:
      - if:
          condition:
            lambda: |-
              int ph = id(printer_phase);
              return id(current_page) == 2 && ph >= 3 && ph <= 8;
          then:
            - lvgl.widget.update:
                id: lbl_print_status
                text_color: !lambda |-
                  uint32_t hi, period;
                  switch (id(printer_phase)) {
                    case 3: hi = 0xFF3333; period = 1600; break;  // ошибка
                    case 4: hi = 0xFFB300; period = 1800; break;  // пауза
                    case 6: hi = 0xFFFFFF; period = 1200; break;  // очистка
                    case 7: hi = 0xAA66FF; period = 1400; break;  // калибровка
                    default: hi = 0xFF8A00; period = 1400; break; // нагрев, подготовка
                  }
                  // Яркость от 35 до 100 %
                  float k = 0.35f + 0.65f * (0.5f + 0.5f * sinf((millis() % period) * 6.2831853f / period));
                  auto ch = [k](uint32_t c, int sh) -> uint32_t {
                    return ((uint32_t) (((c >> sh) & 0xFF) * k + 0.5f)) << sh;
                  };
                  return lv_color_hex(ch(hi, 16) | ch(hi, 8) | ch(hi, 0));
