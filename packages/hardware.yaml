# ---------------------------------------------------------------------------
# Waveshare ESP32-S3-Touch-AMOLED-1.43
# 466x466 круглый AMOLED (CO5300 / SH8601, QSPI) + ёмкостный тач FT3168 (I2C)
#
# Распиновка (проверена по демо-коду Waveshare и сообществу ESPHome):
#   Дисплей QSPI : CS=GPIO9  CLK=GPIO10  D0=GPIO11  D1=GPIO12  D2=GPIO13
#                  D3=GPIO14  RESET=GPIO21
#   Питание LCD : GPIO42 (LCD EN, активно в 1)
#   I2C (тач,    : SDA=GPIO47  SCL=GPIO48
#   IMU, RTC)
#   Тач FT3168  : 0x38, без линий RST и INT
#   Кнопка BOOT  : GPIO0 (активна в 0)
# ---------------------------------------------------------------------------

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # На плате стоит ESP32-S3R8. 8 МБ — безопасное значение: если флеш 16 МБ,
  # прошивка всё равно встанет, просто останется неиспользованное место.
  flash_size: 8MB
  framework:
    type: esp-idf

# 8 МБ octal PSRAM — обязательна для буфера кадра 466x466
psram:
  mode: octal
  speed: 80MHz

i2c:
  id: bus_i2c
  sda: GPIO47
  scl: GPIO48
  frequency: 400kHz
  # Печатает найденные адреса при загрузке — по ним видно, какой тач на плате
  scan: true

spi:
  id: bus_qspi
  type: quad
  clk_pin: GPIO10
  data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

display:
  - platform: mipi_spi
    id: amoled
    model: CO5300
    spi_id: bus_qspi
    cs_pin: GPIO9
    reset_pin: GPIO21
    # LCD EN — по схеме панель питается только при высоком уровне на GPIO42
    enable_pin: GPIO42
    data_rate: 40MHz
    spi_mode: MODE0
    color_order: rgb
    invert_colors: false
    # Панель 466x466 внутри контроллера на 480x480 сдвинута на 6 пикселей
    dimensions:
      width: 466
      height: 466
      offset_width: 6
      offset_height: 0
    # Яркость AMOLED (0..255), дальше ей управляет number.screen_brightness
    brightness: 180
    auto_clear_enabled: false
    update_interval: never

# Тачскрин FT3168, I2C-адрес 0x38. Линии RST и INT на этой плате не разведены —
# чип опрашивается только по I2C (проверено по схеме Waveshare, см. README).
#
# Используется драйвер cst816, а не ft5x06, хотя чип из семейства FT. Причина:
# ft5x06 в ESPHome читает vendor ID из регистра 0xA8 и принимает лишь значения
# 0x51/0x11/0xCD, а на всё остальное вызывает mark_failed() и больше не
# опрашивает панель — FT3168 в этот список не входит. У cst816 карта регистров
# совпадает с FT3168 (0x02 — число касаний, 0x03..0x06 — координаты), а опция
# skip_probe отключает проверку chip id.
touchscreen:
  - platform: cst816
    id: touch
    i2c_id: bus_i2c
    address: 0x38
    skip_probe: true
    display: amoled
    on_touch:
      - script.execute: wake_screen

binary_sensor:
  - platform: gpio
    id: boot_button
    name: Кнопка BOOT
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - script.execute: wake_screen
      - lvgl.page.next:
