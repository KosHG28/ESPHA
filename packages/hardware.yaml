# ---------------------------------------------------------------------------
# Waveshare ESP32-S3-Touch-AMOLED-1.43
# 466x466 круглый AMOLED (CO5300 / SH8601, QSPI) + ёмкостный тач FT3168 (I2C)
#
# Распиновка (проверена по демо-коду Waveshare и сообществу ESPHome):
#   Дисплей QSPI : CS=GPIO9  CLK=GPIO10  D0=GPIO11  D1=GPIO12  D2=GPIO13
#                  D3=GPIO14  RESET=GPIO21
#   Питание LCD : GPIO42 (LCD EN, активно в 1)
#   I2C (тач,    : SDA=GPIO47  SCL=GPIO48
#   IMU, RTC)
#   Тач FT3168  : 0x38, без линий RST и INT
#   Кнопка BOOT  : GPIO0 (активна в 0)
# ---------------------------------------------------------------------------

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # На плате стоит ESP32-S3R8. 8 МБ — безопасное значение: если флеш 16 МБ,
  # прошивка всё равно встанет, просто останется неиспользованное место.
  flash_size: 8MB
  framework:
    type: esp-idf

# 8 МБ octal PSRAM — обязательна для буфера кадра 466x466
psram:
  mode: octal
  speed: 80MHz

i2c:
  id: bus_i2c
  sda: GPIO47
  scl: GPIO48
  frequency: 400kHz
  # Печатает найденные адреса при загрузке — по ним видно, какой тач на плате
  scan: true

spi:
  id: bus_qspi
  type: quad
  clk_pin: GPIO10
  data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

display:
  - platform: mipi_spi
    id: amoled
    model: CO5300
    spi_id: bus_qspi
    cs_pin: GPIO9
    reset_pin: GPIO21
    # LCD EN — по схеме панель питается только при высоком уровне на GPIO42
    enable_pin: GPIO42
    data_rate: 40MHz
    spi_mode: MODE0
    color_order: rgb
    invert_colors: false
    # Панель 466x466 внутри контроллера на 480x480 сдвинута на 6 пикселей
    dimensions:
      width: 466
      height: 466
      offset_width: 6
      offset_height: 0
    # Яркость AMOLED (0..255), дальше ей управляет number.screen_brightness
    brightness: 180
    auto_clear_enabled: false
    update_interval: never

# Тачскрин FT3168, I2C-адрес 0x38. Линии RST и INT на этой плате не разведены —
# чип только опрашивается по I2C (сверено со схемой Waveshare, см. README).
#
# Драйвер свой, в components/ft3168. Штатные не подходят:
#   ft5x06 — читает vendor ID из 0xA8, принимает только 0x51/0x11/0xCD,
#            на остальное вызывает mark_failed() и больше не опрашивает панель;
#   cst816 — читает 13 байт одним пакетом с адреса 0x00, а FT3168 пакетное
#            чтение не отдаёт.
# Свой драйвер повторяет проверенную логику Waveshare: запись power mode 0x01
# в регистр 0xA5 при старте и чтение регистров 0x02..0x06 по одному байту.
touchscreen:
  - platform: ft3168
    id: touch
    i2c_id: bus_i2c
    address: 0x38
    display: amoled
    # Диапазон сырых координат задан явно, чтобы он не зависел от того,
    # успел ли инициализироваться дисплей к моменту настройки тача.
    calibration:
      x_min: 0
      x_max: 465
      y_min: 0
      y_max: 465
    on_touch:
      - script.execute: wake_screen
      - lambda: |-
          id(swipe_dx) = 0;
          id(swipe_dy) = 0;
    on_update:
      - lambda: |-
          if (!touches.empty()) {
            // x_org/y_org — точка, в которой касание началось
            id(swipe_dx) = (int) touches[0].x - (int) touches[0].x_org;
            id(swipe_dy) = (int) touches[0].y - (int) touches[0].y_org;
          }
    on_release:
      - if:
          condition:
            lambda: |-
              int dx = id(swipe_dx), dy = id(swipe_dy);
              int adx = dx < 0 ? -dx : dx;
              int ady = dy < 0 ? -dy : dy;
              return dx <= -${swipe_threshold} && adx > ady;
          then:
            - lvgl.page.next:
      - if:
          condition:
            lambda: |-
              int dx = id(swipe_dx), dy = id(swipe_dy);
              int adx = dx < 0 ? -dx : dx;
              int ady = dy < 0 ? -dy : dy;
              return dx >= ${swipe_threshold} && adx > ady;
          then:
            - lvgl.page.previous:
      - lambda: |-
          id(swipe_dx) = 0;
          id(swipe_dy) = 0;

# Смещение текущего касания от точки его начала. Листание страниц считается
# здесь, а не жестами LVGL: жест доходит до виджета под пальцем и до корневого
# контейнера страницы не всплывает.
globals:
  - id: swipe_dx
    type: int
    restore_value: false
    initial_value: '0'
  - id: swipe_dy
    type: int
    restore_value: false
    initial_value: '0'

binary_sensor:
  - platform: gpio
    id: boot_button
    name: Кнопка BOOT
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - script.execute: wake_screen
      - lvgl.page.next:
