# ---------------------------------------------------------------------------
# Waveshare ESP32-S3-Touch-AMOLED-1.43
# 466x466 круглый AMOLED (CO5300 / SH8601, QSPI) + ёмкостный тач FT3168 (I2C)
#
# Распиновка (проверена по демо-коду Waveshare и сообществу ESPHome):
#   Дисплей QSPI : CS=GPIO9  CLK=GPIO10  D0=GPIO11  D1=GPIO12  D2=GPIO13
#                  D3=GPIO14  RESET=GPIO21
#   I2C (тач,    : SDA=GPIO47  SCL=GPIO48
#   IMU, RTC)
#   Кнопка BOOT  : GPIO0 (активна в 0)
# ---------------------------------------------------------------------------

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # На плате стоит ESP32-S3R8. 8 МБ — безопасное значение: если флеш 16 МБ,
  # прошивка всё равно встанет, просто останется неиспользованное место.
  flash_size: 8MB
  framework:
    type: esp-idf

# 8 МБ octal PSRAM — обязательна для буфера кадра 466x466
psram:
  mode: octal
  speed: 80MHz

i2c:
  id: bus_i2c
  sda: GPIO47
  scl: GPIO48
  frequency: 400kHz
  # Печатает найденные адреса при загрузке — по ним видно, какой тач на плате
  scan: true

spi:
  id: bus_qspi
  type: quad
  clk_pin: GPIO10
  data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

display:
  - platform: mipi_spi
    id: amoled
    model: CO5300
    spi_id: bus_qspi
    cs_pin: GPIO9
    reset_pin: GPIO21
    data_rate: 40MHz
    spi_mode: MODE0
    color_order: rgb
    invert_colors: false
    # Панель 466x466 внутри контроллера на 480x480 сдвинута на 6 пикселей
    dimensions:
      width: 466
      height: 466
      offset_width: 6
      offset_height: 0
    # Яркость AMOLED (0..255), дальше ей управляет number.screen_brightness
    brightness: 180
    auto_clear_enabled: false
    update_interval: never

# Плата выпускается в двух ревизиях с разными тачскринами, и по внешнему виду
# они не отличаются. Поэтому объявлены оба драйвера — рабочим окажется тот,
# чей контроллер реально стоит на плате.
#
#   старая ревизия: дисплей SH8601 + тач FT3168, адрес 0x38
#   новая ревизия:  дисплей CO5300  + тач CST820, адрес 0x15
#
# Тот драйвер, чей чип не отвечает по I2C, помечается как failed и просто
# молчит. Чтобы убрать ошибку из логов, посмотрите результат сканирования шины
# (строки «Found i2c device at address ...» при загрузке) и удалите лишний блок.
touchscreen:
  - platform: ft5x06
    id: touch_ft
    i2c_id: bus_i2c
    # FT3168 совместим с регистровой картой FT5x06
    address: 0x38
    display: amoled
    on_touch:
      - script.execute: wake_screen

  - platform: cst816
    id: touch_cst
    i2c_id: bus_i2c
    # CST820 определяется драйвером cst816 по chip id 0xB7
    address: 0x15
    display: amoled
    on_touch:
      - script.execute: wake_screen

binary_sensor:
  - platform: gpio
    id: boot_button
    name: Кнопка BOOT
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - script.execute: wake_screen
      - lvgl.page.next:
