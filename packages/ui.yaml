# ---------------------------------------------------------------------------
# Интерфейс на LVGL для круглого экрана 466x466.
#
# Четыре страницы; листаются свайпом (считается в packages/hardware.yaml, а не
# жестами LVGL), кнопкой BOOT или действием lvgl.page.next из Home Assistant.
#
# Поворот изображения не используется: у CO5300 нет аппаратной перестановки
# осей, поэтому любой поворот, кроме 180°, разворачивается процессором на
# каждом кадре — на этой плате получалось заметно медленно.
#
# Вся геометрия ниже — от центра экрана 233,233, радиус 233. Виджет с центром (x, y) от центра экрана влезает
# в круг, если sqrt(x² + y²) + половина его диагонали < 233.
# ---------------------------------------------------------------------------

font:
  # Часы: только цифры, двоеточие и пробел (для мигания двоеточия)
  - file: "gfonts://Roboto@700"
    id: font_time
    size: 96
    bpp: 4
    glyphs: "0123456789: -"

  # Крупный процент на странице принтера
  - file: "gfonts://Roboto@700"
    id: font_pct
    size: 58
    bpp: 4
    glyphs: "0123456789%-"

  - file: "gfonts://Roboto@500"
    id: font_l
    size: 38
    bpp: 4
    glyphsets: [GF_Latin_Kernel, GF_Cyrillic_Core]
    glyphs: ["°"]
    ignore_missing_glyphs: true

  - file: "gfonts://Roboto@400"
    id: font_m
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Kernel, GF_Cyrillic_Core]
    glyphs: ["°"]
    ignore_missing_glyphs: true

  - file: "gfonts://Roboto@400"
    id: font_s
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Kernel, GF_Cyrillic_Core]
    glyphs: ["°"]
    ignore_missing_glyphs: true

  # Текст вперемешку с иконками Material Design Icons
  - file: "gfonts://Roboto@400"
    id: font_icon
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Kernel, GF_Cyrillic_Core]
    glyphs: ["°"]
    ignore_missing_glyphs: true
    extras:
      - file:
          url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
          type: web
        glyphs:
          - "\U000F0E5B"   # mdi-printer-3d-nozzle — сопло
          - "\U000F1A45"   # mdi-heat-wave — стол
          - "\U000F0F58"   # mdi-layers-triple — слои
          - "\U000F0150"   # mdi-clock-outline — остаток времени

  # Крупная иконка принтера в центре страницы
  - file:
      url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: font_printer
    size: 76
    bpp: 4
    glyphsets: []
    glyphs: ["\U000F042B"]   # mdi-printer-3d

lvgl:
  id: lvgl_main
  displays: [amoled]
  touchscreens: [touch]
  buffer_size: 100%
  default_font: font_m
  bg_color: 0x000000
  text_color: 0xFFFFFF
  border_width: 0
  pad_all: 0
  page_wrap: true

  style_definitions:
    - id: style_page
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      radius: 0

    - id: style_card
      bg_color: 0x14181D
      bg_opa: COVER
      radius: 22
      border_width: 0
      pad_all: 6
      text_color: 0xFFFFFF

    - id: style_caption
      text_font: font_s
      text_color: 0x8A9199

    - id: style_value
      text_font: font_m
      text_color: 0xFFFFFF

    - id: style_dot
      width: 10
      height: 10
      radius: 5
      border_width: 0
      bg_opa: COVER

    # Прозрачный контейнер во весь экран: к нему крепится содержимое страницы,
    # и он же сдвигается на пару пикселей для защиты AMOLED от выгорания
    - id: style_root
      width: 466
      height: 466
      align: CENTER
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0

    # Строка «подпись — значение» на странице устройства
    - id: style_row
      width: 330
      height: 34
      align: CENTER
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0

  # Индикатор страниц один на все страницы: раньше он был скопирован
  # в каждую из них, и точки приходилось править в четырёх местах
  top_layer:
    widgets:
      # Полноэкранная вспышка о событии. Обычно скрыта; показывается скриптом
      # flash_screen. Не кликабельна, чтобы не перехватывать касания.
      - obj:
          id: alert_overlay
          width: 466
          height: 466
          align: CENTER
          radius: 233
          bg_color: 0x22DD44
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          hidden: true
          clickable: false
          scrollable: false
          widgets:
            - label:
                id: alert_text
                text: "ГОТОВО"
                text_font: font_pct
                text_color: 0x08210E
                align: CENTER

      - obj:
          align: CENTER
          y: 196
          width: 76
          height: 14
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: false
          widgets:
            - obj: { id: dot_1, styles: style_dot, bg_color: 0x03A9F4, align: CENTER, x: -33 }
            - obj: { id: dot_2, styles: style_dot, bg_color: 0x33383E, align: CENTER, x: -11 }
            - obj: { id: dot_3, styles: style_dot, bg_color: 0x33383E, align: CENTER, x: 11 }
            - obj: { id: dot_4, styles: style_dot, bg_color: 0x33383E, align: CENTER, x: 33 }

  pages:
    # =====================================================================
    # Страница 1 — часы
    # =====================================================================
    - id: page_clock
      styles: style_page
      scrollable: false
      on_load:
        - script.execute:
            id: mark_page
            idx: 0
      widgets:
        - obj:
            id: root_clock
            styles: style_root
            scrollable: false
            widgets:
              # Кольцо-индикатор: доля прошедших минут в сутках
              - arc:
                  id: arc_day
                  width: 436
                  height: 436
                  align: CENTER
                  clickable: false
                  adjustable: false
                  min_value: 0
                  max_value: 1440
                  value: 0
                  start_angle: 270
                  end_angle: 270
                  arc_width: 6
                  arc_color: 0x1B1F24
                  arc_rounded: true
                  indicator:
                    arc_width: 6
                    arc_color: 0x03A9F4
                    arc_rounded: true
                  knob:
                    bg_opa: TRANSP
                    pad_all: 0

              - label:
                  text: "${slot1_title}"
                  styles: style_caption
                  align: CENTER
                  y: -134

              - label:
                  id: lbl_slot1
                  text: "--"
                  text_font: font_l
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: -98

              - label:
                  id: lbl_time
                  text: "--:--"
                  text_font: font_time
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: -8

              - label:
                  id: lbl_date
                  text: "нет связи с Home Assistant"
                  styles: style_caption
                  align: CENTER
                  y: 62

              - label:
                  text: "${slot2_title}"
                  styles: style_caption
                  align: CENTER
                  y: 112

              - label:
                  id: lbl_slot2
                  text: "--"
                  text_font: font_l
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: 148

    # =====================================================================
    # Страница 2 — четыре значения из Home Assistant
    # =====================================================================
    - id: page_home
      styles: style_page
      scrollable: false
      on_load:
        - script.execute:
            id: mark_page
            idx: 1
      widgets:
        - obj:
            id: root_home
            styles: style_root
            scrollable: false
            widgets:
              - label:
                  text: "Дом"
                  styles: style_caption
                  align: CENTER
                  y: -186

              - obj:
                  styles: style_card
                  width: 164
                  height: 128
                  align: CENTER
                  x: -86
                  y: -74
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        text: "${slot1_title}"
                        styles: style_caption
                        align: TOP_MID
                        y: 8
                    - label:
                        id: lbl_slot1_card
                        text: "--"
                        text_font: font_l
                        align: CENTER
                        y: 10
              - obj:
                  styles: style_card
                  width: 164
                  height: 128
                  align: CENTER
                  x: 86
                  y: -74
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        text: "${slot2_title}"
                        styles: style_caption
                        align: TOP_MID
                        y: 8
                    - label:
                        id: lbl_slot2_card
                        text: "--"
                        text_font: font_l
                        align: CENTER
                        y: 10
              - obj:
                  styles: style_card
                  width: 164
                  height: 128
                  align: CENTER
                  x: -86
                  y: 74
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        text: "${slot3_title}"
                        styles: style_caption
                        align: TOP_MID
                        y: 8
                    - label:
                        id: lbl_slot3
                        text: "--"
                        text_font: font_l
                        align: CENTER
                        y: 10
              - obj:
                  styles: style_card
                  width: 164
                  height: 128
                  align: CENTER
                  x: 86
                  y: 74
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        text: "${slot4_title}"
                        styles: style_caption
                        align: TOP_MID
                        y: 8
                    - label:
                        id: lbl_slot4
                        text: "--"
                        text_font: font_l
                        align: CENTER
                        y: 10

    # =====================================================================
    # Страница 3 — 3D-принтер Bambu Lab
    # =====================================================================
    - id: page_printer
      styles: style_page
      scrollable: false
      on_load:
        - script.execute:
            id: mark_page
            idx: 2
      widgets:
        - obj:
            id: root_printer
            styles: style_root
            scrollable: false
            widgets:
              # Кольцо прогресса с разрывом сверху
              - arc:
                  id: arc_print
                  width: 436
                  height: 436
                  align: CENTER
                  clickable: false
                  adjustable: false
                  min_value: 0
                  max_value: 100
                  value: 0
                  start_angle: 285
                  end_angle: 255
                  arc_width: 14
                  arc_color: 0x1B1F24
                  arc_rounded: true
                  indicator:
                    arc_width: 14
                    arc_color: 0x22DD44
                    arc_rounded: true
                  knob:
                    bg_opa: TRANSP
                    pad_all: 0

              - label:
                  id: lbl_print_pct
                  text: "--"
                  text_font: font_pct
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: -122

              - label:
                  id: lbl_print_status
                  text: "нет данных"
                  text_font: font_m
                  text_color: 0x8A9199
                  align: CENTER
                  y: -66

              - label:
                  text: "\U000F042B"
                  text_font: font_printer
                  text_color: 0x22DD44
                  align: CENTER
                  y: 2

              - label:
                  id: lbl_print_nozzle
                  text: "\U000F0E5B --"
                  text_font: font_icon
                  text_color: 0xFFFFFF
                  align: CENTER
                  x: -128
                  y: 12

              - label:
                  id: lbl_print_bed
                  text: "\U000F1A45 --"
                  text_font: font_icon
                  text_color: 0xFFFFFF
                  align: CENTER
                  x: 128
                  y: 12

              - label:
                  id: lbl_print_layer
                  text: "\U000F0F58 --"
                  text_font: font_icon
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: 96

              - label:
                  id: lbl_print_eta
                  text: "\U000F0150 --"
                  text_font: font_icon
                  text_color: 0x03A9F4
                  align: CENTER
                  y: 146

    # =====================================================================
    # Страница 4 — состояние устройства и яркость
    # =====================================================================
    - id: page_system
      styles: style_page
      scrollable: false
      on_load:
        - script.execute:
            id: mark_page
            idx: 3
      widgets:
        - obj:
            id: root_system
            styles: style_root
            scrollable: false
            widgets:
              - label:
                  text: "Устройство"
                  styles: style_caption
                  align: CENTER
                  y: -186

              # Подпись слева, значение справа: раньше обе были центрированы
              # по фиксированному x, и колонки разъезжались от длины текста
              - obj:
                  styles: style_row
                  scrollable: false
                  clickable: false
                  y: -122
                  widgets:
                    - label: { text: "Сеть", styles: style_caption, align: LEFT_MID }
                    - label:
                        id: lbl_sys_ssid
                        text: "--"
                        styles: style_value
                        align: RIGHT_MID
                        width: 210
                        long_mode: DOT
                        text_align: RIGHT

              - obj:
                  styles: style_row
                  scrollable: false
                  clickable: false
                  y: -80
                  widgets:
                    - label: { text: "Сигнал", styles: style_caption, align: LEFT_MID }
                    - label:
                        id: lbl_sys_wifi
                        text: "--"
                        styles: style_value
                        align: RIGHT_MID
                        width: 210
                        long_mode: DOT
                        text_align: RIGHT

              - obj:
                  styles: style_row
                  scrollable: false
                  clickable: false
                  y: -38
                  widgets:
                    - label: { text: "IP", styles: style_caption, align: LEFT_MID }
                    - label:
                        id: lbl_sys_ip
                        text: "--"
                        styles: style_value
                        align: RIGHT_MID
                        width: 210
                        long_mode: DOT
                        text_align: RIGHT

              - obj:
                  styles: style_row
                  scrollable: false
                  clickable: false
                  y: 4
                  widgets:
                    - label: { text: "Работает", styles: style_caption, align: LEFT_MID }
                    - label:
                        id: lbl_sys_uptime
                        text: "--"
                        styles: style_value
                        align: RIGHT_MID
                        width: 210
                        long_mode: DOT
                        text_align: RIGHT

              - label:
                  id: lbl_sys_i2c
                  text: "I2C: —"
                  styles: style_caption
                  align: CENTER
                  y: 46
                  width: 360
                  long_mode: DOT
                  text_align: CENTER

              - arc:
                  id: arc_bright
                  width: 128
                  height: 128
                  align: CENTER
                  y: 118
                  min_value: 5
                  max_value: 100
                  value: 70
                  adjustable: true
                  arc_width: 10
                  arc_color: 0x1B1F24
                  arc_rounded: true
                  indicator:
                    arc_width: 10
                    arc_color: 0x03A9F4
                    arc_rounded: true
                  knob:
                    bg_color: 0x03A9F4
                  on_press:
                    - lambda: 'id(lvgl_press_count)++;'
                  on_change:
                    - lambda: 'id(lvgl_change_count)++;'
                    - number.set:
                        id: screen_brightness
                        value: !lambda 'return x;'
                    - lvgl.label.update:
                        id: lbl_bright
                        text: !lambda |-
                          char buf[8];
                          snprintf(buf, sizeof(buf), "%d%%", (int) x);
                          return std::string(buf);
              - label:
                  id: lbl_bright
                  text: "70%"
                  text_font: font_m
                  align: CENTER
                  y: 118
                  clickable: false
