# ---------------------------------------------------------------------------
# Интерфейс на LVGL для круглого экрана 466x466.
#
# Четыре страницы; листаются свайпом (считается в packages/hardware.yaml, а не
# жестами LVGL), кнопкой BOOT или действием lvgl.page.next из Home Assistant.
#
# Поворот изображения не используется: у CO5300 нет аппаратной перестановки
# осей, поэтому любой поворот, кроме 180°, разворачивается процессором на
# каждом кадре — на этой плате получалось заметно медленно.
#
# Вся геометрия ниже — от центра экрана 233,233, радиус 233. Виджет с центром (x, y) от центра экрана влезает
# в круг, если sqrt(x² + y²) + половина его диагонали < 233.
# ---------------------------------------------------------------------------

font:
  # Часы: только цифры, двоеточие и пробел (для мигания двоеточия)
  - file: "gfonts://Roboto@700"
    id: font_time
    size: 96
    bpp: 4
    glyphs: "0123456789: -"

  # Крупный процент на странице принтера
  - file: "gfonts://Roboto@700"
    id: font_pct
    size: 58
    bpp: 4
    glyphs: "0123456789%-"

  # Крупные значения на двух плитках страницы «Дом»
  - file: "gfonts://Roboto@500"
    id: font_tile
    size: 60
    bpp: 4
    glyphsets: [GF_Latin_Kernel, GF_Cyrillic_Core]
    glyphs: ["°"]
    ignore_missing_glyphs: true

  - file: "gfonts://Roboto@500"
    id: font_l
    size: 38
    bpp: 4
    glyphsets: [GF_Latin_Kernel, GF_Cyrillic_Core]
    glyphs: ["°"]
    ignore_missing_glyphs: true

  - file: "gfonts://Roboto@400"
    id: font_m
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Kernel, GF_Cyrillic_Core]
    glyphs: ["°"]
    ignore_missing_glyphs: true

  - file: "gfonts://Roboto@400"
    id: font_s
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Kernel, GF_Cyrillic_Core]
    glyphs: ["°"]
    ignore_missing_glyphs: true

  # Текст вперемешку с иконками Material Design Icons
  - file: "gfonts://Roboto@400"
    id: font_icon
    size: 26
    bpp: 4
    glyphsets: [GF_Latin_Kernel, GF_Cyrillic_Core]
    glyphs: ["°"]
    ignore_missing_glyphs: true
    extras:
      - file:
          url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
          type: web
        glyphs:
          - "\U000F0E5B"   # mdi-printer-3d-nozzle — сопло
          - "\U000F1A45"   # mdi-heat-wave — стол
          - "\U000F0F58"   # mdi-layers-triple — слои
          - "\U000F0150"   # mdi-clock-outline — остаток времени

  # Снежинки погодного фона: три формы из Noto Sans Symbols 2 и две из
  # Material Design Icons, в двух размерах — дальние и ближние
  - file:
      type: gfonts
      family: Noto Sans Symbols 2
      weight: 400
    id: font_flake_s
    size: 14
    bpp: 4
    glyphsets: []
    glyphs: ["❄", "❅", "❆"]
    extras:
      - file:
          url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
          type: web
        glyphs:
          - "\U000F0717"   # mdi-snowflake
          - "\U000F0F2A"   # mdi-snowflake-variant

  - file:
      type: gfonts
      family: Noto Sans Symbols 2
      weight: 400
    id: font_flake_l
    size: 26
    bpp: 4
    glyphsets: []
    glyphs: ["❄", "❅", "❆"]
    extras:
      - file:
          url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
          type: web
        glyphs:
          - "\U000F0717"   # mdi-snowflake
          - "\U000F0F2A"   # mdi-snowflake-variant

  # Иконка погоды рядом с уличной температурой
  - file:
      url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: font_wicon
    size: 36
    bpp: 4
    glyphsets: []
    glyphs:
      - "\U000F0599"   # weather-sunny
      - "\U000F0594"   # weather-night
      - "\U000F0595"   # weather-partly-cloudy
      - "\U000F0F31"   # weather-night-partly-cloudy
      - "\U000F0590"   # weather-cloudy
      - "\U000F0597"   # weather-rainy
      - "\U000F0596"   # weather-pouring
      - "\U000F067F"   # weather-snowy-rainy
      - "\U000F0598"   # weather-snowy
      - "\U000F0F36"   # weather-snowy-heavy
      - "\U000F0592"   # weather-hail
      - "\U000F0593"   # weather-lightning
      - "\U000F067E"   # weather-lightning-rainy

  # Крупная иконка принтера в центре страницы
  - file:
      url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: font_printer
    size: 76
    bpp: 4
    glyphsets: []
    glyphs: ["\U000F042B"]   # mdi-printer-3d

lvgl:
  id: lvgl_main
  displays: [amoled]
  touchscreens: [touch]
  # Буфер на весь экран был нужен только для программного поворота,
  # от которого отказались. Вернули четверть экрана — минус ~330 КБ памяти.
  buffer_size: ${lvgl_buffer_size}
  # Проверять, нужна ли перерисовка, 30 раз в секунду, а не 60 —
  # для этого интерфейса разницы не видно, а холостой работы вдвое меньше
  refresh_interval: 33ms
  default_font: font_m
  bg_color: 0x000000
  text_color: 0xFFFFFF
  border_width: 0
  pad_all: 0
  page_wrap: true

  style_definitions:
    - id: style_page
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      radius: 0

    - id: style_card
      bg_color: 0x14181D
      bg_opa: COVER
      radius: 22
      border_width: 0
      pad_all: 6
      text_color: 0xFFFFFF

    - id: style_caption
      text_font: font_s
      text_color: 0x8A9199

    - id: style_value
      text_font: font_m
      text_color: 0xFFFFFF

    - id: style_dot
      width: 10
      height: 10
      radius: 5
      border_width: 0
      bg_opa: COVER

    # Прозрачный контейнер во весь экран: к нему крепится содержимое страницы,
    # и он же сдвигается на пару пикселей для защиты AMOLED от выгорания
    - id: style_root
      width: 466
      height: 466
      align: CENTER
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0

    # Капля или снежинка погодного фона. Размер и цвет задаёт
    # packages/weather.yaml в зависимости от погоды
    - id: style_fx
      width: 2
      height: 16
      radius: 1
      bg_color: 0x2A6F99
      bg_opa: COVER
      border_width: 0
      pad_all: 0

    # Снежинка погодного фона: только знак, без фона
    - id: style_flake
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0

    # Брызги от капли
    - id: style_splash
      width: 3
      height: 3
      radius: 1
      bg_color: 0x2A6F99
      bg_opa: COVER
      border_width: 0
      pad_all: 0

    # Прозрачный слой погодного фона во весь экран
    - id: style_fx_layer
      width: 466
      height: 466
      align: TOP_LEFT
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0

    # Клуб облака; цвет задаёт packages/weather.yaml
    - id: style_puff
      bg_color: 0x1D232A
      bg_opa: COVER
      border_width: 0
      pad_all: 0

    # Строка «подпись — значение» на странице устройства
    - id: style_row
      width: 330
      height: 34
      align: CENTER
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0

  # Индикатор страниц один на все страницы: раньше он был скопирован
  # в каждую из них, и точки приходилось править в четырёх местах
  top_layer:
    widgets:
      # Полноэкранная вспышка о событии. Обычно скрыта; показывается скриптом
      # flash_screen. Не кликабельна, чтобы не перехватывать касания.
      - obj:
          id: alert_overlay
          width: 466
          height: 466
          align: CENTER
          radius: 233
          bg_color: 0x22DD44
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          hidden: true
          clickable: false
          scrollable: false
          widgets:
            - label:
                id: alert_text
                text: "ГОТОВО"
                text_font: font_pct
                text_color: 0x08210E
                align: CENTER

      - obj:
          id: page_dots
          align: CENTER
          y: 184
          width: 76
          height: 14
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: false
          widgets:
            - obj: { id: dot_1, styles: style_dot, bg_color: 0x03A9F4, align: CENTER, x: -33 }
            - obj: { id: dot_2, styles: style_dot, bg_color: 0x33383E, align: CENTER, x: -11 }
            - obj: { id: dot_3, styles: style_dot, bg_color: 0x33383E, align: CENTER, x: 11 }
            - obj: { id: dot_4, styles: style_dot, bg_color: 0x33383E, align: CENTER, x: 33 }

  pages:
    # =====================================================================
    # Страница 1 — часы
    # =====================================================================
    - id: page_clock
      styles: style_page
      scrollable: false
      on_load:
        - script.execute:
            id: mark_page
            idx: 0
      widgets:
        # Погодный фон — первым, чтобы лежать под часами. Всё двигает
        # packages/weather.yaml, только пока открыта эта страница
        - obj:
            id: weather_fx
            styles: style_fx_layer
            hidden: true
            clickable: false
            scrollable: false
            widgets:
              # Молния: свечение и яркая сердцевина по одним и тем же точкам.
              # Точки задаёт packages/weather.yaml при каждом ударе
              - line:
                  id: fx_bolt_glow
                  points: [[0, 0], [0, 1]]
                  line_width: 11
                  line_color: 0x4A7BD6
                  line_rounded: true
                  hidden: true
                  clickable: false
              - line:
                  id: fx_bolt
                  points: [[0, 0], [0, 1]]
                  line_width: 4
                  line_color: 0xFFFFFF
                  line_rounded: true
                  hidden: true
                  clickable: false
              # Облака: каждое — несколько перекрывающихся клубов
              - obj:
                  id: fx_clouds
                  styles: style_fx_layer
                  clickable: false
                  scrollable: false
                  widgets:
                    - obj:
                        width: 180
                        height: 72
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        hidden: true
                        clickable: false
                        scrollable: false
                        widgets:
                          - obj: { styles: style_puff, x: 0, y: 32, width: 72, height: 40, radius: 20, clickable: false }
                          - obj: { styles: style_puff, x: 38, y: 6, width: 70, height: 66, radius: 33, clickable: false }
                          - obj: { styles: style_puff, x: 88, y: 0, width: 58, height: 58, radius: 29, clickable: false }
                          - obj: { styles: style_puff, x: 116, y: 26, width: 64, height: 46, radius: 23, clickable: false }
                    - obj:
                        width: 180
                        height: 72
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        hidden: true
                        clickable: false
                        scrollable: false
                        widgets:
                          - obj: { styles: style_puff, x: 0, y: 32, width: 72, height: 40, radius: 20, clickable: false }
                          - obj: { styles: style_puff, x: 38, y: 6, width: 70, height: 66, radius: 33, clickable: false }
                          - obj: { styles: style_puff, x: 88, y: 0, width: 58, height: 58, radius: 29, clickable: false }
                          - obj: { styles: style_puff, x: 116, y: 26, width: 64, height: 46, radius: 23, clickable: false }
                    - obj:
                        width: 180
                        height: 72
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        hidden: true
                        clickable: false
                        scrollable: false
                        widgets:
                          - obj: { styles: style_puff, x: 0, y: 32, width: 72, height: 40, radius: 20, clickable: false }
                          - obj: { styles: style_puff, x: 38, y: 6, width: 70, height: 66, radius: 33, clickable: false }
                          - obj: { styles: style_puff, x: 88, y: 0, width: 58, height: 58, radius: 29, clickable: false }
                          - obj: { styles: style_puff, x: 116, y: 26, width: 64, height: 46, radius: 23, clickable: false }
              # Капли и градины; размер и цвет задаёт packages/weather.yaml
              - obj:
                  id: fx_drops
                  styles: style_fx_layer
                  clickable: false
                  scrollable: false
                  widgets:
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
                    - obj: { styles: style_fx, hidden: true, clickable: false }
              # Снежинки: чётные мелкие («далеко»), нечётные крупные («близко»)
              - obj:
                  id: fx_flakes
                  styles: style_fx_layer
                  clickable: false
                  scrollable: false
                  widgets:
                    - label: { text: "❄", text_font: font_flake_s, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "❅", text_font: font_flake_l, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "❆", text_font: font_flake_s, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "\U000F0717", text_font: font_flake_l, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "\U000F0F2A", text_font: font_flake_s, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "❄", text_font: font_flake_l, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "❅", text_font: font_flake_s, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "❆", text_font: font_flake_l, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "\U000F0717", text_font: font_flake_s, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "\U000F0F2A", text_font: font_flake_l, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "❄", text_font: font_flake_s, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "❅", text_font: font_flake_l, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "❆", text_font: font_flake_s, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "\U000F0717", text_font: font_flake_l, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "\U000F0F2A", text_font: font_flake_s, styles: style_flake, hidden: true, clickable: false }
                    - label: { text: "❄", text_font: font_flake_l, styles: style_flake, hidden: true, clickable: false }
              # Брызги от капель
              - obj:
                  id: fx_splash
                  styles: style_fx_layer
                  clickable: false
                  scrollable: false
                  widgets:
                    - obj: { styles: style_splash, hidden: true, clickable: false }
                    - obj: { styles: style_splash, hidden: true, clickable: false }
                    - obj: { styles: style_splash, hidden: true, clickable: false }
                    - obj: { styles: style_splash, hidden: true, clickable: false }
                    - obj: { styles: style_splash, hidden: true, clickable: false }
                    - obj: { styles: style_splash, hidden: true, clickable: false }
                    - obj: { styles: style_splash, hidden: true, clickable: false }
                    - obj: { styles: style_splash, hidden: true, clickable: false }
        - obj:
            id: root_clock
            styles: style_root
            scrollable: false
            widgets:
              - label:
                  text: "${slot1_title}"
                  styles: style_caption
                  align: CENTER
                  y: -134

              # Иконка погоды и уличная температура — в одну строку по центру
              - obj:
                  align: CENTER
                  y: -98
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 10
                  widgets:
                    - label:
                        id: lbl_weather_icon
                        text: ""
                        text_font: font_wicon
                        hidden: true
                    - label:
                        id: lbl_slot1
                        text: "--"
                        text_font: font_l
                        text_color: 0xFFFFFF

              # Время без двоеточия: часы белые справа от центра зазора,
              # минуты цветные слева от него. Цифры Roboto одинаковой
              # ширины, поэтому время не прыгает
              - label:
                  id: lbl_time_h
                  text: "--"
                  text_font: font_time
                  text_color: 0xFFFFFF
                  text_align: RIGHT
                  width: 130
                  align: CENTER
                  x: -79
                  y: -8
              - label:
                  id: lbl_time_m
                  text: "--"
                  text_font: font_time
                  text_color: ${time_minutes_color}
                  text_align: LEFT
                  width: 130
                  align: CENTER
                  x: 79
                  y: -8

              - label:
                  id: lbl_date
                  text: "нет связи с Home Assistant"
                  styles: style_caption
                  align: CENTER
                  y: 62

              - label:
                  text: "${slot2_title}"
                  styles: style_caption
                  align: CENTER
                  y: 112

              - label:
                  id: lbl_slot2
                  text: "--"
                  text_font: font_l
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: 148

    # =====================================================================
    # Страница 2 — два значения из Home Assistant крупно
    # =====================================================================
    - id: page_home
      styles: style_page
      scrollable: false
      on_load:
        - script.execute:
            id: mark_page
            idx: 1
      widgets:
        - obj:
            id: root_home
            styles: style_root
            scrollable: false
            widgets:
              - obj:
                  styles: style_card
                  width: 196
                  height: 200
                  radius: 28
                  align: CENTER
                  x: -103
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        text: "${slot1_title}"
                        styles: style_caption
                        align: TOP_MID
                        y: 22
                    - label:
                        id: lbl_slot1_card
                        text: "--"
                        text_font: font_tile
                        align: CENTER
                        y: 14
              - obj:
                  styles: style_card
                  width: 196
                  height: 200
                  radius: 28
                  align: CENTER
                  x: 103
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        text: "${slot2_title}"
                        styles: style_caption
                        align: TOP_MID
                        y: 22
                    - label:
                        id: lbl_slot2_card
                        text: "--"
                        text_font: font_tile
                        align: CENTER
                        y: 14

    # =====================================================================
    # Страница 3 — 3D-принтер Bambu Lab
    # =====================================================================
    - id: page_printer
      styles: style_page
      scrollable: false
      on_load:
        - script.execute:
            id: mark_page
            idx: 2
      widgets:
        - obj:
            id: root_printer
            styles: style_root
            scrollable: false
            widgets:
              # Кольцо прогресса с разрывом сверху
              - arc:
                  id: arc_print
                  width: 436
                  height: 436
                  align: CENTER
                  clickable: false
                  adjustable: false
                  min_value: 0
                  max_value: 100
                  value: 0
                  start_angle: 285
                  end_angle: 255
                  arc_width: 14
                  arc_color: 0x1B1F24
                  arc_rounded: true
                  indicator:
                    arc_width: 14
                    arc_color: 0x22DD44
                    arc_rounded: true
                  knob:
                    bg_opa: TRANSP
                    pad_all: 0

              - label:
                  id: lbl_print_pct
                  text: "--"
                  text_font: font_pct
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: -122

              - label:
                  id: lbl_print_status
                  text: "нет данных"
                  text_font: font_m
                  text_color: 0x8A9199
                  align: CENTER
                  y: -66

              - label:
                  text: "\U000F042B"
                  text_font: font_printer
                  text_color: 0x22DD44
                  align: CENTER
                  y: 2

              - label:
                  id: lbl_print_nozzle
                  text: "\U000F0E5B --"
                  text_font: font_icon
                  text_color: 0xFFFFFF
                  align: CENTER
                  x: -128
                  y: 12

              - label:
                  id: lbl_print_bed
                  text: "\U000F1A45 --"
                  text_font: font_icon
                  text_color: 0xFFFFFF
                  align: CENTER
                  x: 128
                  y: 12

              - label:
                  id: lbl_print_layer
                  text: "\U000F0F58 --"
                  text_font: font_icon
                  text_color: 0xFFFFFF
                  align: CENTER
                  y: 96

              - label:
                  id: lbl_print_eta
                  text: "\U000F0150 --"
                  text_font: font_icon
                  text_color: 0x03A9F4
                  align: CENTER
                  y: 146

              # Когда принтер не печатает: когда закончилась последняя печать.
              # Показывается вместо слоя и остатка времени, которые в простое
              # бессмысленны
              - label:
                  id: lbl_print_last
                  text: ""
                  styles: style_caption
                  align: CENTER
                  y: 110
                  width: 380
                  long_mode: DOT
                  text_align: CENTER
                  hidden: true

    # =====================================================================
    # Страница 4 — состояние устройства и яркость
