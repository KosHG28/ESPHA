                        styles: style_value
                        align: RIGHT_MID
                        width: 210
                        long_mode: DOT
                        text_align: RIGHT

              - obj:
                  styles: style_row
                  scrollable: false
                  clickable: false
                  y: -38
                  widgets:
                    - label: { text: "IP", styles: style_caption, align: LEFT_MID }
                    - label:
                        id: lbl_sys_ip
                        text: "--"
                        styles: style_value
                        align: RIGHT_MID
                        width: 210
                        long_mode: DOT
                        text_align: RIGHT

              - obj:
                  styles: style_row
                  scrollable: false
                  clickable: false
                  y: 4
                  widgets:
                    - label: { text: "Работает", styles: style_caption, align: LEFT_MID }
                    - label:
                        id: lbl_sys_uptime
                        text: "--"
                        styles: style_value
                        align: RIGHT_MID
                        width: 210
                        long_mode: DOT
                        text_align: RIGHT

              - arc:
                  id: arc_bright
                  width: 128
                  height: 128
                  align: CENTER
                  y: 100
                  min_value: 5
                  max_value: 100
                  value: 70
                  adjustable: true
                  arc_width: 10
                  arc_color: 0x1B1F24
                  arc_rounded: true
                  indicator:
                    arc_width: 10
                    arc_color: 0x03A9F4
                    arc_rounded: true
                  knob:
                    bg_color: 0x03A9F4
                  on_change:
                    - number.set:
                        id: screen_brightness
                        value: !lambda 'return x;'
                    - lvgl.label.update:
                        id: lbl_bright
                        text: !lambda |-
                          char buf[8];
                          snprintf(buf, sizeof(buf), "%d%%", (int) x);
                          return std::string(buf);
              - label:
                  id: lbl_bright
                  text: "70%"
                  text_font: font_m
                  align: CENTER
                  y: 100
                  clickable: false
