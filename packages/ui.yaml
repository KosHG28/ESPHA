            scrollable: false
            widgets:
              - label:
                  text: "Устройство"
                  styles: style_caption
                  align: CENTER
                  y: -186

              # Подпись слева, значение справа: раньше обе были центрированы
              # по фиксированному x, и колонки разъезжались от длины текста
              - obj:
                  styles: style_row
                  scrollable: false
                  clickable: false
                  y: -122
                  widgets:
                    - label: { text: "Сеть", styles: style_caption, align: LEFT_MID }
                    - label:
                        id: lbl_sys_ssid
                        text: "--"
                        styles: style_value
                        align: RIGHT_MID
                        width: 210
                        long_mode: DOT
                        text_align: RIGHT

              - obj:
                  styles: style_row
                  scrollable: false
                  clickable: false
                  y: -80
                  widgets:
                    - label: { text: "Сигнал", styles: style_caption, align: LEFT_MID }
                    - label:
                        id: lbl_sys_wifi
