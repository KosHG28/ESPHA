# ---------------------------------------------------------------------------
# Поведение интерфейса: индикатор страниц, защита AMOLED от выгорания
# и индикация потери связи с Home Assistant.
# ---------------------------------------------------------------------------

globals:
  # Номер страницы на экране: 0 часы, 1 дом, 2 принтер, 3 устройство.
  # По нему анимации понимают, видно ли их вообще.
  - id: current_page
    type: int
    restore_value: false
    initial_value: '0'

  # Фаза сдвига содержимого против выгорания: 0..3
  - id: shift_idx
    type: int
    restore_value: false
    initial_value: '0'

script:
  # Подсветить точку активной страницы. Индекс приходит из on_load страницы —
  # сам по себе триггер не знает, какая страница загрузилась.
  - id: mark_page
    parameters:
      idx: int
    mode: restart
    then:
      - lambda: |-
          id(current_page) = idx;
          // Активная точка — цветом страницы, остальные тёмные
          static const uint32_t ACCENT[4] = {0x5AC8FA, 0x2DD4BF, 0x22DD44, 0x9AA4AE};
          lv_obj_t *dots[4] = {id(dot_1), id(dot_2), id(dot_3), id(dot_4)};
          for (int i = 0; i < 4; i++)
            lv_obj_set_style_bg_color(dots[i], lv_color_hex(i == idx ? ACCENT[i] : 0x33383E), 0);
      - script.execute: dots_autohide

  # Какие страницы показывать — выключатели «Страница …» в HA. Выключенная
  # страница пропускается при листании, её точка прячется, а оставшиеся
  # точки заново расставляются по дуге вдоль нижнего края круга
  - id: layout_dots
    mode: queued
    max_runs: 3
    then:
      - lambda: |-
          // Выключатели восстанавливают состояние при старте раньше, чем
          // создаётся интерфейс; тогда просто ждём вызова из on_boot
          if (id(dot_1) == nullptr)
            return;
          id(page_home)->skip = !id(sw_page_climate).state;
          id(page_printer)->skip = !id(sw_page_printer).state;
          id(page_system)->skip = !id(sw_page_system).state;
          lv_obj_t *dots[4] = {id(dot_1), id(dot_2), id(dot_3), id(dot_4)};
          bool on[4] = {true, id(sw_page_climate).state, id(sw_page_printer).state, id(sw_page_system).state};
          int n = 0;
          for (int i = 0; i < 4; i++)
            if (on[i]) n++;
          // Дуга радиусом 188 px от центра экрана, шаг 12°; контейнер точек
          // стоит на 180 px ниже центра
          int k = 0;
          for (int i = 0; i < 4; i++) {
            if (!on[i]) {
              lv_obj_add_flag(dots[i], LV_OBJ_FLAG_HIDDEN);
              continue;
            }
            float a = (k - (n - 1) / 2.0f) * 12.0f * 0.0174533f;
            lv_obj_align(dots[i], LV_ALIGN_CENTER, (int) lroundf(188.0f * sinf(a)),
                         (int) lroundf(188.0f * cosf(a) - 180.0f));
            lv_obj_clear_flag(dots[i], LV_OBJ_FLAG_HIDDEN);
            k++;
          }
      # Если выключили страницу, которая сейчас на экране, — на часы
      - if:
          condition:
            lambda: |-
              int p = id(current_page);
              return (p == 1 && id(page_home)->skip) || (p == 2 && id(page_printer)->skip) ||
                     (p == 3 && id(page_system)->skip);
          then:
            - lvgl.page.show:
                id: page_clock

  # Точки страниц видны после касания или смены страницы и прячутся через
  # page_dots_timeout без касаний: чище вид и меньше выгорание AMOLED
  - id: dots_autohide
    mode: restart
    then:
      - lvgl.widget.show: page_dots
      - delay: ${page_dots_timeout}
      - lvgl.widget.hide: page_dots

  - id: splash_timeout
    mode: single
    then:
      - delay: 60s
      - lvgl.widget.hide: splash

  # Вспышка во весь экран о важном событии: экран будится на полную яркость
  # и несколько раз мигает цветом. Цвет и надпись задаёт вызывающая сторона.
  # Если экран выключен (ночь или никого нет), вспышка не показывается:
  # будить некого. Страница принтера откроется, когда экран включат
  - id: flash_screen
    parameters:
      color: int
      text: string
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(screen_off);'
          then:
            - script.stop: flash_screen
      - script.execute: wake_screen
      - lvgl.label.update:
          id: alert_text
          text: !lambda 'return text;'
      - lvgl.widget.update:
          id: alert_overlay
          bg_color: !lambda 'return lv_color_hex(color);'
      - repeat:
          count: 4
          then:
            - lvgl.widget.show: alert_overlay
            - delay: 400ms
            - lvgl.widget.hide: alert_overlay
            - delay: 250ms
      # Последний показ подольше, чтобы надпись успели прочитать
      - lvgl.widget.show: alert_overlay
      - delay: 3s
      - lvgl.widget.hide: alert_overlay

switch:
  - platform: template
    id: sw_page_climate
    name: Страница климата
    icon: mdi:home-thermometer-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: layout_dots
    on_turn_off:
      - script.execute: layout_dots

  - platform: template
    id: sw_page_printer
    name: Страница 3D-принтера
    icon: mdi:printer-3d
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: layout_dots
    on_turn_off:
      - script.execute: layout_dots

  - platform: template
    id: sw_page_system
    name: Страница устройства
    icon: mdi:chip
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: layout_dots
    on_turn_off:
      - script.execute: layout_dots

interval:
  # Защита AMOLED: содержимое каждые несколько минут сдвигается на два
  # пикселя по кругу, чтобы статичные элементы не выжигали пиксели.
  - interval: ${pixel_shift_interval}
    then:
      - lambda: 'id(shift_idx) = (id(shift_idx) + 1) % 4;'
      - lvgl.widget.update:
          id: [root_clock, root_home, root_printer, root_system]
          translate_x: !lambda 'return (id(shift_idx) == 1 || id(shift_idx) == 2) ? 2 : -2;'
          translate_y: !lambda 'return (id(shift_idx) >= 2) ? 2 : -2;'

api:
  # Значения на экране застывают при потере связи, и отличить свежие данные от
  # вчерашних невозможно. Поэтому при отвале они приглушаются.
  on_client_disconnected:
    # Пока нет связи, вспышки о событиях принтера не нужны
    - lambda: 'id(printer_armed) = false;'
    - lvgl.widget.update:
        id: [lbl_slot1, lbl_slot1_card, lbl_slot2, lbl_slot2_card,
             lbl_time_h, lbl_time_m, lbl_print_pct]
        text_color: 0x555C63
    - lvgl.label.update:
        id: lbl_sun
        text: "нет связи с Home Assistant"
        text_color: 0x8A9199
    # Без связи неизвестно, есть ли кто дома, — вернуть обычный режим
    - script.execute: power_eval
  on_client_connected:
    - lvgl.widget.update:
        id: [lbl_slot1, lbl_slot1_card, lbl_slot2, lbl_slot2_card,
             lbl_time_h, lbl_print_pct]
        text_color: 0xFFFFFF
    - lvgl.widget.update:
        id: lbl_time_m
        text_color: ${time_minutes_color}
    - script.execute: refresh_clock
    - script.execute: printer_arm
    - script.execute: refresh_sun
    - script.execute:
        id: color_temps
        force: true
    - script.execute: power_eval
    - lvgl.widget.hide: splash
