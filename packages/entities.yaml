# ---------------------------------------------------------------------------
# Данные: время, два «слота» с сущностями Home Assistant и диагностика.
#
# Какие сущности показывать — задаётся подстановками slotN_entity/title/format
# в espha.yaml. После усыновления устройства в ESPHome-дашборде их можно
# переопределить, не трогая этот файл.
# ---------------------------------------------------------------------------

time:
  # Часы реального времени на плате: держат время при перезагрузке и без Wi-Fi
  - platform: pcf85063
    id: rtc_time
    timezone: ${timezone}
    i2c_id: bus_i2c
    address: 0x51
    update_interval: 60min
    # Время из RTC приходит раньше, чем из Home Assistant, — сразу показать его
    on_time_sync:
      - script.execute: refresh_clock

  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time_sync:
      - pcf85063.write_time:
      - script.execute: refresh_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: refresh_clock

script:
  # Раз в минуту: время, иконка погоды, ночь и расписание экрана
  - id: refresh_clock
    mode: restart
    then:
      # Часы и минуты — отдельные надписи без двоеточия. В обычную минуту
      # меняются только минуты, и перерисовывается только их надпись
      - lvgl.label.update:
          id: lbl_time_h
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid())
              return std::string("--");
            char buf[4];
            snprintf(buf, sizeof(buf), "%02d", now.hour);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_time_m
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid())
              return std::string("--");
            char buf[4];
            snprintf(buf, sizeof(buf), "%02d", now.minute);
            return std::string(buf);
      # Новая цифра мягко проявляется за полсекунды. Только если часы на
      # экране и он не выключен — иначе смотреть некому
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid())
            return;
          static int last_h = -1, last_m = -1;
          const bool changed_m = last_m >= 0 && now.minute != last_m;
          const bool changed_h = last_h >= 0 && now.hour != last_h;
          last_h = now.hour;
          last_m = now.minute;
          if (id(screen_off) || id(current_page) != 0)
            return;
          auto fade_in = [](lv_obj_t *o) {
            lv_anim_delete(o, nullptr);
            lv_obj_set_style_opa(o, LV_OPA_TRANSP, 0);
            lv_obj_set_style_translate_y(o, 0, 0);  // если прервали каскад пробуждения
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, o);
            lv_anim_set_values(&a, LV_OPA_TRANSP, LV_OPA_COVER);
            lv_anim_set_duration(&a, 500);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
            lv_anim_set_exec_cb(&a, [](void *obj, int32_t v) {
              lv_obj_set_style_opa((lv_obj_t *) obj, (lv_opa_t) v, 0);
            });
            lv_anim_start(&a);
          };
          if (changed_m)
            fade_in(id(lbl_time_m));
          if (changed_h)
            fade_in(id(lbl_time_h));
      - script.execute: weather_icon
      # Ночь (для звёзд и луны) и ночное выключение экрана
      - script.execute: update_night
      - script.execute: power_eval
      # «сегодня» в строке о последней печати в полночь должно стать «вчера»
      - script.execute: refresh_printer_last
      # Новый год и дни рождения
      - script.execute: holiday_check

  # Цвет температуры по значению: холодно — голубой, норма — белый, жарко —
  # оранжевый. Пороги — подстановки slotN_cold / slotN_hot в espha.yaml.
  # В холодный или жаркий цвет — сразу за порогом, обратно в белый — только
  # отойдя от порога на 0,3°, чтобы цвет не дёргался на границе.
  # force: перекрасить, даже если цвет не менялся (после восстановления связи,
  # когда надписи были серыми)
  - id: color_temps
    parameters:
      force: bool
    mode: queued
    max_runs: 3
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: |-
                static int z1 = 1, z2 = 1, shown1 = -1, shown2 = -1;
                auto zone = [](float v, int z, float cold, float hot) -> int {
                  const float H = 0.3f;
                  if (std::isnan(v)) return 1;
                  if (z == 0 && v >= cold + H) z = 1;
                  if (z == 2 && v <= hot - H) z = 1;
                  if (z == 1) {
                    if (v < cold) z = 0;
                    else if (v > hot) z = 2;
                  }
                  return z;
                };
                auto color = [](int z) -> lv_color_t {
                  if (z == 0) return lv_color_hex(${temp_cold_color});
                  if (z == 2) return lv_color_hex(${temp_hot_color});
                  return lv_color_hex(0xFFFFFF);
                };
                z1 = zone(id(ha_slot1).state, z1, ${slot1_cold}, ${slot1_hot});
                z2 = zone(id(ha_slot2).state, z2, ${slot2_cold}, ${slot2_hot});
                if (force || z1 != shown1) {
                  shown1 = z1;
                  lv_obj_set_style_text_color(id(lbl_slot1), color(z1), 0);
                  lv_obj_set_style_text_color(id(lbl_slot1_card), color(z1), 0);
                }
                if (force || z2 != shown2) {
                  shown2 = z2;
                  lv_obj_set_style_text_color(id(lbl_slot2), color(z2), 0);
                  lv_obj_set_style_text_color(id(lbl_slot2_card), color(z2), 0);
                  // Словом на странице «Климат» — цветом зоны; норма — бирюзовая
                  static const char *const WORD[3] = {"Прохладно", "Комфортно", "Жарко"};
                  lv_obj_t *cf = id(lbl_comfort);
                  lv_label_set_text(cf, std::isnan(id(ha_slot2).state) ? "" : WORD[z2]);
                  lv_obj_set_style_text_color(cf, z2 == 1 ? lv_color_hex(0x2DD4BF) : color(z2), 0);
                }

  # Ближайшее событие солнца: днём «закат 18:55», ночью «восход 6:42».
  # Время приходит из sun.sun в UTC в виде 2026-09-25T03:42:10.123+00:00 и
  # переводится в местное
  - id: refresh_sun
    mode: restart
    then:
      - if:
          condition:
            api.connected:
          then:
            - lvgl.label.update:
                id: lbl_sun
                text: !lambda |-
                  auto local_hm = [](const std::string &iso, int &h, int &m) -> bool {
                    int Y, Mo, D, hh, mm, ss;
                    if (sscanf(iso.c_str(), "%d-%d-%dT%d:%d:%d", &Y, &Mo, &D, &hh, &mm, &ss) != 6)
                      return false;
                    // Смещение пояса в конце строки: +00:00, +03:00 или Z
                    int off = 0;
                    size_t p = iso.find_last_of("+-");
                    if (p != std::string::npos && p > 10) {
                      int oh = 0, om = 0;
                      if (sscanf(iso.c_str() + p + 1, "%d:%d", &oh, &om) >= 1)
                        off = (oh * 60 + om) * 60 * (iso[p] == '-' ? -1 : 1);
                    }
                    // Дни от 1970-01-01 по григорианскому календарю
                    int y = Y - (Mo <= 2);
                    int era = (y >= 0 ? y : y - 399) / 400;
                    int yoe = y - era * 400;
                    int doy = (153 * (Mo + (Mo > 2 ? -3 : 9)) + 2) / 5 + D - 1;
                    int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
                    long days = (long) era * 146097 + doe - 719468;
                    time_t t = (time_t) (days * 86400L + hh * 3600 + mm * 60 + ss - off);
                    auto lt = ESPTime::from_epoch_local(t);
                    h = lt.hour;
                    m = lt.minute;
                    return true;
                  };
                  // В день рождения вместо солнца — поздравление
                  if (!id(birthday_line).empty())
                    return "\U000F00EB " + id(birthday_line);
                  const bool night = id(is_night);
                  int h, m;
                  if (!local_hm(night ? id(ha_sun_rising).state : id(ha_sun_setting).state, h, m))
                    return std::string("");
                  char buf[64];
                  if (night)
                    snprintf(buf, sizeof(buf), "\U000F059C восход %d:%02d", h, m);
                  else
                    snprintf(buf, sizeof(buf), "\U000F059B закат %d:%02d", h, m);
                  return std::string(buf);
            # Поздравление — золотым, солнце — серым
            - lambda: |-
                lv_obj_set_style_text_color(id(lbl_sun),
                    lv_color_hex(id(birthday_line).empty() ? 0x8A9199 : 0xFFC107), 0);

  # Дверь открыта уже door_alarm_delay: тревога
  - id: door_timer
    mode: restart
    then:
      - delay: ${door_alarm_delay}
      - lambda: 'id(door_alarm) = true;'
      - if:
          condition:
            lambda: 'return !id(nobody_home);'
          then:
            - script.execute: wake_screen
            - lvgl.page.show:
                id: page_clock

globals:
  - id: door_alarm
    type: bool
    restore_value: false
    initial_value: 'false'

interval:
  # Мигание значка двери при тревоге: красный — тёмно-красный, раз в полсекунды.
  # Только пока часы на экране и экран не выключен
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return id(door_alarm) && id(current_page) == 0 && !id(screen_off);'
          then:
            - lvgl.widget.update:
                id: lbl_door
                text_color: !lambda |-
                  static bool on = false;
                  on = !on;
                  return lv_color_hex(on ? 0xFF3333 : 0x5A1010);

sensor:
  # ---- слоты с данными из Home Assistant --------------------------------
  - platform: homeassistant
    id: ha_slot1
    entity_id: ${slot1_entity}
    internal: true
    # На экране одна цифра после запятой — мелкие колебания не перерисовываем
    filters:
      - delta: 0.05
    on_value:
      - lvgl.label.update:
          id: [lbl_slot1, lbl_slot1_card]
          text: !lambda |-
            if (std::isnan(x))
              return std::string("--");
            char buf[24];
            snprintf(buf, sizeof(buf), "${slot1_format}", x);
            return std::string(buf);
      - script.execute:
          id: color_temps
          force: false

  - platform: homeassistant
    id: ha_slot2
    entity_id: ${slot2_entity}
    internal: true
    filters:
      - delta: 0.05
    on_value:
      - lvgl.label.update:
          id: [lbl_slot2, lbl_slot2_card]
          text: !lambda |-
            if (std::isnan(x))
              return std::string("--");
            char buf[24];
            snprintf(buf, sizeof(buf), "${slot2_format}", x);
            return std::string(buf);
      - script.execute:
          id: color_temps
          force: false

  # Влажность в комнате — на странице «Климат». Если такой сущности нет,
  # блок влажности просто не появляется
  - platform: homeassistant
    id: ha_room_humidity
    entity_id: ${room_humidity_entity}
    internal: true
    filters:
      - delta: 0.5
    on_value:
      - lambda: |-
          bool ok = !std::isnan(x);
          if (ok) {
            char buf[12];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            lv_label_set_text(id(lbl_hum), buf);
            lv_obj_clear_flag(id(clim_hum), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(clim_hum), LV_OBJ_FLAG_HIDDEN);
          }
          // С влажностью «на улице» уходит влево, без неё — по центру
          lv_obj_align(id(clim_out), LV_ALIGN_CENTER, ok ? -85 : 0, 100);

  # ---- диагностика самого устройства ------------------------------------
  - platform: wifi_signal
    id: wifi_rssi
    name: Уровень Wi-Fi
    entity_category: diagnostic
    update_interval: 60s
    on_value:
      - lvgl.label.update:
          id: lbl_sys_wifi
          text: !lambda |-
            char buf[24];
            snprintf(buf, sizeof(buf), "%.0f dBm", x);
            return std::string(buf);

  - platform: uptime
    id: dev_uptime
    name: Время работы
    entity_category: diagnostic
    update_interval: 60s
    on_value:
      - lvgl.label.update:
          id: lbl_sys_uptime
          text: !lambda |-
            uint32_t s = (uint32_t) x;
            char buf[24];
            if (s < 3600)
              snprintf(buf, sizeof(buf), "%u мин", s / 60);
            else if (s < 86400)
              snprintf(buf, sizeof(buf), "%u ч %u мин", s / 3600, (s % 3600) / 60);
            else
              snprintf(buf, sizeof(buf), "%u д %u ч", s / 86400, (s % 86400) / 3600);
            return std::string(buf);

  - platform: internal_temperature
    id: chip_temperature
    name: Температура чипа
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  # Ближайшие восход и закат — атрибуты sun.sun
  - platform: homeassistant
    id: ha_sun_rising
    entity_id: sun.sun
    attribute: next_rising
    internal: true
    on_value:
      - script.execute: refresh_sun
  - platform: homeassistant
    id: ha_sun_setting
    entity_id: sun.sun
    attribute: next_setting
    internal: true
    on_value:
      - script.execute: refresh_sun

  # Диагностика: что реально отвечает на шине I2C.
  # 0x15 — тач CST820, 0x38 — тач FT3168, 0x51 — часы PCF85063,
  # 0x6B — акселерометр QMI8658.
  - platform: template
    id: i2c_devices
    name: Устройства на шине I2C
    icon: mdi:chip
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      std::string out;
      for (uint8_t a = 0x08; a < 0x78; a++) {
        if (id(bus_i2c)->write(a, nullptr, 0) == esphome::i2c::ERROR_OK) {
          char b[8];
          snprintf(b, sizeof(b), "0x%02X ", a);
          out += b;
        }
      }
      if (out.empty())
        return std::string("шина пуста");
      out.erase(out.size() - 1);
      return out;

  - platform: wifi_info
    ip_address:
      id: dev_ip
      name: IP-адрес
      entity_category: diagnostic
      on_value:
        - lvgl.label.update:
            id: lbl_sys_ip
            text: !lambda 'return x.empty() ? std::string("--") : x;'
    ssid:
      id: dev_ssid
      name: Сеть Wi-Fi
      entity_category: diagnostic
      on_value:
        - lvgl.label.update:
            id: lbl_sys_ssid
            text: !lambda 'return x.empty() ? std::string("--") : x;'

binary_sensor:
  # Входная дверь: пока открыта (on), на часах горит оранжевый значок.
  # Открыта дольше door_alarm_delay — значок красный и мигает, экран
  # просыпается (кроме случая, когда дома никого нет: смотреть некому)
  - platform: homeassistant
    id: ha_door
    entity_id: ${door_entity}
    internal: true
    on_state:
      - lvgl.widget.update:
          id: lbl_door
          hidden: !lambda 'return !x;'
          text_color: 0xFF9800
      - if:
          condition:
            lambda: 'return x;'
          then:
            - script.execute: door_timer
          else:
            - script.stop: door_timer
            - lambda: 'id(door_alarm) = false;'

button:
  - platform: template
    name: Пересканировать I2C
    icon: mdi:magnify
    entity_category: diagnostic
    on_press:
      - component.update: i2c_devices

  - platform: restart
    name: Перезагрузка
    entity_category: config
