# ---------------------------------------------------------------------------
# Погодный фон на странице часов: дождь с брызгами о край экрана (и косой
# при ветре), снежинки разной формы, град, облака и молнии в грозу. Ясной
# ночью — мерцающие звёзды, созвездие, которое сейчас видно над домом, и
# изредка метеор; ясным днём — солнце с медленно вращающимися лучами. Работает и в приглушённом режиме — при
# гашении экран возвращается на часы, а частицы переходят на яркую палитру,
# чтобы их было видно при низкой яркости панели.
#
# Виджеты — первым слоем страницы часов (fx_root в packages/ui.yaml),
# поэтому лежат под временем. Анимацию считает компонент на C++
# components/weather_fx; здесь — только что показывать. На других страницах
# частицы стоят на месте и не тратят ни кадра. Каждая частица — несколько
# пикселей, облако — около 180×70, поэтому за кадр перерисовываются только
# маленькие области.
#
# Молния — ломаная линия со свечением, мигает дважды. Ярко светится только
# сама молния, яркость экрана она не трогает.
#
# Вид осадков (глобальная weather_mode):
#   0 нет  1 дождь  2 снег  3 мокрый снег (дождь + снег)  4 град  5 листопад
# ---------------------------------------------------------------------------

globals:
  - id: weather_mode
    type: int
    restore_value: false
    initial_value: '0'
  # Сколько частиц: слабые осадки — меньше, сильные — больше
  - id: weather_count
    type: int
    restore_value: false
    initial_value: '0'
  # Сколько облаков (0–3)
  - id: weather_clouds
    type: int
    restore_value: false
    initial_value: '0'
  # Гроза: молнии
  - id: weather_storm
    type: bool
    restore_value: false
    initial_value: 'false'
  # Солнце за горизонтом (по sun.sun; пока его нет — с 21 до 6)
  - id: is_night
    type: bool
    restore_value: false
    initial_value: 'false'
  # Звёзды: ясная ночь
  - id: weather_stars
    type: bool
    restore_value: false
    initial_value: 'false'
  # Воздушный змей: 0 нет, 1 изредка (ясный ветреный день), 2 часто (проверка)
  - id: weather_kite
    type: int
    restore_value: false
    initial_value: '0'
  # Радуга горит, пока millis() не дошёл до этого момента
  - id: rainbow_until
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Салют идёт, пока millis() не дошёл до этого момента
  - id: fireworks_until
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Солнце: ясный день
  - id: weather_sun
    type: bool
    restore_value: false
    initial_value: 'false'

text_sensor:
  - platform: homeassistant
    id: ha_weather
    entity_id: ${weather_condition_entity}
    internal: true
    on_value:
      # Днём дождь сменился сухой погодой — на 10 минут радуга
      - lambda: |-
          static std::string prev;
          auto wet = [](const std::string &c) {
            return c == "light_rain" || c == "rain" || c == "heavy_rain" || c == "showers" ||
                   c == "thunderstorm_with_rain" || c == "sleet";
          };
          const bool dry = x == "clear" || x == "partly_cloudy" || x == "cloudy";
          if (wet(prev) && dry && !id(is_night))
            id(rainbow_until) = millis() + 600000u;
          prev = x;
      - script.execute: weather_apply
      - script.execute: weather_icon

  # Солнце над горизонтом или нет — отсюда «ночь» для звёзд и иконки луны
  - platform: homeassistant
    id: ha_sun
    entity_id: sun.sun
    internal: true
    on_value:
      - script.execute: update_night
      # Днём в строке солнца — закат, ночью — восход
      - script.execute: refresh_sun
      - script.execute: weather_icon

# Ветер: при нём дождь идёт наискосок, а снег сносит вбок, порывы «мотают». Направление —
# откуда дует, в градусах, как принято в метеорологии
sensor:
  - platform: homeassistant
    id: ha_wind_speed
    entity_id: ${weather_wind_speed_entity}
    internal: true
    # Ветер решает, будет ли осенью листопад
    on_value:
      - script.execute: weather_apply
  - platform: homeassistant
    id: ha_wind_bearing
    entity_id: ${weather_wind_bearing_entity}
    internal: true
  # Порывы: время от времени снос на пару секунд усиливается до их силы
  - platform: homeassistant
    id: ha_wind_gust
    entity_id: ${weather_wind_gust_entity}
    internal: true
    on_value:
      - script.execute: weather_apply

  # Где дом — из зоны «Дом» Home Assistant. По ним и по времени считается,
  # какие созвездия сейчас над горизонтом. Пока HA не ответил — координаты
  # из home_latitude / home_longitude в espha.yaml
  - platform: homeassistant
    id: ha_home_lat
    entity_id: zone.home
    attribute: latitude
    internal: true
  - platform: homeassistant
    id: ha_home_lon
    entity_id: zone.home
    attribute: longitude
    internal: true

  # Высота Солнца над горизонтом, градусы: около нуля — зарево на восходе и
  # закате
  - platform: homeassistant
    id: ha_sun_elev
    entity_id: sun.sun
    attribute: elevation
    internal: true

select:
  # Как рисовать дождь. «Капли на стекле» — капли появляются и медленно
  # сползают: нет быстрого движения, значит нет мерцания и нагрузки.
  # «Падающий» — струи сверху вниз; на этой плате они заметно тяжелее
  - platform: template
    id: rain_style_select
    name: Стиль дождя
    icon: mdi:weather-pouring
    entity_category: config
    options: ["Капли на стекле", "Падающий"]
    initial_option: "Капли на стекле"
    optimistic: true
    restore_value: true

  # «Авто» — по погоде из Home Assistant. Остальные пункты — чтобы проверить
  # эффект, не дожидаясь погоды. Новые пункты добавляются только в конец:
  # сохраняется номер выбранного пункта
  - platform: template
    id: weather_fx_select
    name: Фон погоды
    icon: mdi:weather-snowy-rainy
    entity_category: config
    options: ["Авто", "Выкл", "Дождь", "Снег", "Гроза", "Облачно", "Ясная ночь", "Ясный день", "Листопад", "Сердечки", "Воздушный змей", "Радуга", "Иней", "Жара", "Закат", "Самолёт"]
    initial_option: "Авто"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: weather_apply

script:
  # Пересчитать «ночь» и, если она сменилась, звёзды и иконку. Вызывается
  # при смене sun.sun и раз в минуту из refresh_clock
  - id: update_night
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          bool night;
          if (id(ha_sun).has_state() && !id(ha_sun).state.empty()) {
            night = id(ha_sun).state == "below_horizon";
          } else {
            auto now = id(ha_time).now();
            night = now.is_valid() && (now.hour >= 21 || now.hour < 6);
          }
          static int prev = -1;
          id(is_night) = night;
          if (prev == (int) night)
            return;
          prev = night;
          id(weather_apply)->execute();
          id(weather_icon)->execute();
          id(clock_colors)->execute();

  # Иконка погоды рядом с уличной температурой и погода словом под временем
  # («Облачно», «Дождь») — её цветом. Показывают настоящую погоду, а не пункт
  # «Фона погоды». Ночью — луна вместо солнца
  - id: weather_icon
    mode: restart
    then:
      - lambda: |-
          const std::string s = id(ha_weather).has_state() ? id(ha_weather).state : "";
          bool night = id(is_night);
          const char *icon = "";
          uint32_t color = 0x90A4AE;
          if (s == "clear") { icon = night ? "\U000F0594" : "\U000F0599"; color = night ? 0xB0BEC5 : 0xFFB300; }
          else if (s == "partly_cloudy") { icon = night ? "\U000F0F31" : "\U000F0595"; color = night ? 0xB0BEC5 : 0xFFCA28; }
          else if (s == "cloudy" || s == "overcast") { icon = "\U000F0590"; }
          else if (s == "light_rain" || s == "rain") { icon = "\U000F0597"; color = 0x4FC3F7; }
          else if (s == "heavy_rain" || s == "showers") { icon = "\U000F0596"; color = 0x4FC3F7; }
          else if (s == "sleet") { icon = "\U000F067F"; color = 0x81D4FA; }
          else if (s == "light_snow" || s == "snow") { icon = "\U000F0598"; color = 0xE0E0E0; }
          else if (s == "snowfall") { icon = "\U000F0F36"; color = 0xE0E0E0; }
          else if (s == "hail") { icon = "\U000F0592"; color = 0xCFD8DC; }
          else if (s == "thunderstorm" || s == "thunderstorm_with_hail") { icon = "\U000F0593"; color = 0xFFD54F; }
          else if (s == "thunderstorm_with_rain") { icon = "\U000F067E"; color = 0xFFD54F; }

          // Надпись меняем, только когда иконка правда сменилась: этот скрипт
          // вызывается каждую минуту, а лишняя установка текста — лишняя перерисовка
          static const struct { const char *key, *word; } WORDS[] = {
              {"clear", "Ясно"},
              {"partly_cloudy", "Переменная облачность"},
              {"cloudy", "Облачно"},
              {"overcast", "Пасмурно"},
              {"light_rain", "Небольшой дождь"},
              {"rain", "Дождь"},
              {"heavy_rain", "Ливень"},
              {"showers", "Ливень"},
              {"sleet", "Мокрый снег"},
              {"light_snow", "Небольшой снег"},
              {"snow", "Снег"},
              {"snowfall", "Снегопад"},
              {"hail", "Град"},
              {"thunderstorm", "Гроза"},
              {"thunderstorm_with_rain", "Гроза с дождём"},
              {"thunderstorm_with_hail", "Гроза с градом"},
          };
          const char *word = "";
          for (const auto &w : WORDS)
            if (s == w.key) { word = w.word; break; }

          static std::string shown = "-";
          std::string key = std::string(icon) + "|" + s;
          if (shown != key) {
            shown = key;
            lv_obj_t *lbl = id(lbl_weather_icon);
            lv_label_set_text(lbl, icon);
            lv_obj_set_style_text_color(lbl, lv_color_hex(color), 0);
            if (*icon) lv_obj_clear_flag(lbl, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(lbl, LV_OBJ_FLAG_HIDDEN);
            lv_obj_t *st = id(lbl_wstatus);
            lv_label_set_text(st, word);
            lv_obj_set_style_text_color(st, lv_color_hex(color), 0);
          }

  # Выбрать осадки, облака, грозу и звёзды по погоде и настройке «Фон погоды»
  - id: weather_apply
    mode: restart
    then:
      - lambda: |-
          // Номер пункта «Фона погоды»:
          // 0 Авто, 1 Выкл, 2 Дождь, 3 Снег, 4 Гроза, 5 Облачно, 6 Ясная ночь,
          // 7 Ясный день, 8 Листопад, 9 Сердечки, 10 Воздушный змей, 11 Радуга,
          // 12 Иней
          size_t sel = id(weather_fx_select).active_index().value_or(0);
          std::string s;
          switch (sel) {
            case 0: s = id(ha_weather).has_state() ? id(ha_weather).state : ""; break;
            case 2: s = "rain"; break;
            case 3: s = "snow"; break;
            case 4: s = "thunderstorm_with_rain"; break;
            case 5: s = "cloudy"; break;
            case 6: s = "clear"; break;
            case 7: s = "clear"; break;
            case 8: s = "cloudy"; break;
            case 9: s = "clear"; break;
            case 10: s = "clear"; break;
            case 11: s = "partly_cloudy"; break;
            case 12: s = "clear"; break;
            case 13: s = "clear"; break;
            case 14: s = "partly_cloudy"; break;
            case 15: s = "clear"; break;
            default: s = ""; break;
          }
          // Звёзды — ясной или малооблачной ночью, солнце — таким же днём.
          // «Ясная ночь» и «Ясный день» показывают своё в любое время
          const bool fair = s == "clear" || s == "partly_cloudy";
          const bool night = sel == 6 || sel == 15 ? true : (sel == 7 || sel >= 10 ? false : id(is_night));
          id(weather_stars) = fair && night;
          id(weather_sun) = fair && !night;
          int mode = 0, cnt = 0, clouds = 0;
          bool storm = false;
          if (s == "partly_cloudy") { clouds = 1; }
          else if (s == "cloudy") { clouds = 2; }
          else if (s == "overcast") { clouds = 3; }
          // В дождь и снег облаков нет — только сами осадки
          // Дождь густой: капель больше, чем снежинок (до 32)
          else if (s == "light_rain") { mode = 1; cnt = 12; }
          else if (s == "rain") { mode = 1; cnt = 18; }
          else if (s == "heavy_rain" || s == "showers") { mode = 1; cnt = 24; }
          else if (s == "sleet") { mode = 3; cnt = 18; }
          else if (s == "light_snow") { mode = 2; cnt = 8; }
          else if (s == "snow") { mode = 2; cnt = 12; }
          else if (s == "snowfall") { mode = 2; cnt = 16; }
          else if (s == "hail") { mode = 4; cnt = 12; }
          else if (s == "thunderstorm") { storm = true; clouds = 3; }
          else if (s == "thunderstorm_with_rain") { mode = 1; cnt = 18; clouds = 3; storm = true; }
          else if (s == "thunderstorm_with_hail") { mode = 4; cnt = 12; clouds = 3; storm = true; }
          // Листопад: в сентябре и октябре, в ветреный день без осадков —
          // ветер от 5 м/с или порывы от 8. Перестаёт, когда ветер стих
          // ниже 4 и 7 м/с, чтобы не мигать на границе. Ночью — нет: листья
          // заслоняют звёзды и созвездия («Листопад» в «Фоне погоды» — всегда)
          static bool windy = false;
          const float ws = id(ha_wind_speed).state, wg = id(ha_wind_gust).state;
          const bool calm = (std::isnan(ws) || ws < 4.0f) && (std::isnan(wg) || wg < 7.0f);
          if ((!std::isnan(ws) && ws >= 5.0f) || (!std::isnan(wg) && wg >= 8.0f))
            windy = true;
          else if (calm)
            windy = false;
          auto now = id(ha_time).now();
          const bool autumn = now.is_valid() && (now.month == 9 || now.month == 10);
          const bool dry = mode == 0 && !storm && !s.empty();
          if (sel == 8 || (sel == 0 && dry && autumn && windy && !id(is_night))) {
            mode = 5;
            clouds = 0;  // листья летят по чистому небу, облака не нужны
            const bool strong = (!std::isnan(ws) && ws >= 9.0f) || (!std::isnan(wg) && wg >= 14.0f);
            cnt = sel == 8 || strong ? 14 : 10;
          }
          // 14 февраля вместо пустого неба всплывают сердечки (если праздники
          // не выключены — «Праздники: Все»)
          const bool all_hol = id(holiday_mode_select).active_index().value_or(0) == 0;
          const bool valentine = all_hol && now.is_valid() && now.month == 2 && now.day_of_month == 14;
          if (sel == 9 || (sel == 0 && mode == 0 && dry && valentine)) {
            mode = 6;
            cnt = 12;
            // Сердечки — на тёмном фоне: ночное небо (звёзды, созвездие,
            // луна, планеты) с ними только мешает
            id(weather_stars) = false;
          }
          // Праздники (packages/holidays.yaml): вместо пустого неба 8 Марта
          // падают тюльпаны и мимоза, 1 июня всплывают шарики, 1 сентября
          // падают кленовые листья. При «Показать праздник» — в любую погоду
          using namespace weather_fx;
          const int hol = id(holiday);
          const bool preview = id(hol_preview) != 0;
          if ((hol == HOL_MAR8 || hol == HOL_CHILDREN || hol == HOL_SEPT1) && sel != 1 &&
              (preview || (sel == 0 && mode == 0 && dry))) {
            mode = hol == HOL_MAR8 ? 7 : (hol == HOL_CHILDREN ? 8 : 9);
            cnt = 12;
            if (mode == 9)
              clouds = 0;  // кленовые листья — тоже без облаков
            if (preview) {
              clouds = 0;
              storm = false;
            }
          }
          // Проверка ночных праздников днём: показать ясное ночное небо
          if (preview && sel != 1 &&
              (hol == HOL_METEORS || hol == HOL_FULL_MOON || hol == HOL_SUPERMOON || hol == HOL_ECLIPSE ||
               hol == HOL_HALLOWEEN || hol == HOL_KUPALA)) {
            id(weather_stars) = true;
            id(weather_sun) = false;
            mode = 0;
            cnt = 0;
            clouds = 0;
            storm = false;
          }
          // Воздушный змей — ясным ветреным днём, изредка
          id(weather_kite) = sel == 10 ? 2 : (sel == 0 && id(weather_sun) && windy ? 1 : 0);
          id(weather_mode) = mode;
          id(weather_count) = cnt;
          id(weather_clouds) = clouds;
          id(weather_storm) = storm;

# Анимация — в компоненте components/weather_fx (C++). Здесь только решаем,
# что показывать, и раз в кадр передаём это компоненту
weather_fx:
  id: wfx

interval:
  - interval: ${weather_fx_interval}
    then:
      - lambda: |-
          static bool bound = false;
          if (!bound) {
            bound = true;
            // Капли, снежинки, брызги и звёзды рисует холст компонента —
            // объектами LVGL здесь только облака и молния
            id(wfx)->bind(id(fx_root), id(fx_clouds), id(fx_bolt)->obj, id(fx_bolt_glow)->obj,
                          id(font_flake_s)->get_lv_font(), id(font_flake_l)->get_lv_font(),
                          id(font_con)->get_lv_font());
            // За крупными цифрами времени частицы не рисуются: перерисовывать
            // кусок цифры 101 px ради пролетающей капли — самое дорогое.
            // Прямоугольники цифр часов и минут в экранных координатах (с
            // запасом на сдвиг против выгорания)
            id(wfx)->add_exclude(64, 180, 222, 264);
            id(wfx)->add_exclude(244, 184, 402, 264);
          }
          weather_fx::Params p;
          p.mode = id(weather_mode);
          p.count = id(weather_count);
          p.clouds = id(weather_clouds);
          p.storm = id(weather_storm);
          p.stars = id(weather_stars);
          // Радуга — после дождя или пунктом «Радуга»; солнце при ней прячется:
          // в жизни оно за спиной у того, кто смотрит на радугу
          const size_t fx_sel = id(weather_fx_select).active_index().value_or(0);
          p.rainbow = fx_sel == 11 || (fx_sel == 0 && (int32_t) (id(rainbow_until) - millis()) > 0 && !id(is_night));
          p.sun = id(weather_sun) && !p.rainbow;
          // Иней по краю экрана — в мороз от −15° (сходит выше −14°)
          static bool frost = false;
          const float t_out = id(ha_slot1).state;
          if (!std::isnan(t_out)) {
            if (t_out <= -15.0f)
              frost = true;
            else if (t_out > -14.0f)
              frost = false;
          }
          p.frost = frost || fx_sel == 12;
          p.garland = id(fx_garland);
          p.fireworks = (int32_t) (id(fireworks_until) - millis()) > 0;
          p.kite = id(weather_kite);
          p.dim = id(screen_dimmed);
          // Для созвездия: координаты дома и время
          p.lat = std::isnan(id(ha_home_lat).state) ? ${home_latitude} : id(ha_home_lat).state;
          p.lon = std::isnan(id(ha_home_lon).state) ? ${home_longitude} : id(ha_home_lon).state;
          p.utc = (uint32_t) id(ha_time).timestamp_now();
          // Двигать только пока открыты часы, экран не выключен полностью
          // и никто не трогает экран: пока палец на экране и 0,4 с после
          // (идёт листание) все силы отдаются касанию, а дождь на миг замирает.
          // Если отпускание почему-то не пришло — через 5 с погода идёт дальше
          uint32_t since = millis() - id(touch_release_ms);
          bool touching = id(touch_active) ? since < 5000 : since < 400;
          p.active = id(current_page) == 0 && !id(screen_off) && !touching;
          p.wind_speed = id(ha_wind_speed).state;
          p.wind_bearing = id(ha_wind_bearing).state;
          p.wind_gust = id(ha_wind_gust).state;
          // «Стиль дождя»: 0 — капли на стекле, 1 — падающий
          p.rain_style = (int) id(rain_style_select).active_index().value_or(0);
          // Праздник: звезда, ракета, яйца, летучие мыши, «матрица», цвета салюта.
          // При «Фоне погоды: Выкл» — ничего
          using namespace weather_fx;
          const int hol = fx_sel == 1 ? 0 : id(holiday);
          const bool preview = id(hol_preview) != 0;
          p.holiday = hol;
          p.night = id(is_night) || (preview && (hol == HOL_HALLOWEEN || hol == HOL_KUPALA));
          // Светлячки — на Ивана Купалу и тёплыми летними ночами без осадков
          // (на улице от 16°, гаснут ниже 15°)
          static bool warm = false;
          static uint32_t warm_ms = 0;
          static bool summer = false;
          if (warm_ms == 0 || millis() - warm_ms > 60000) {
            warm_ms = millis();
            auto t = id(ha_time).now();
            summer = t.is_valid() && t.month >= 6 && t.month <= 8;
            if (!std::isnan(t_out))
              warm = t_out >= 16.0f || (warm && t_out >= 15.0f);
          }
          p.fireflies = fx_sel != 1 && p.night &&
                        (hol == HOL_KUPALA || (summer && warm && id(weather_mode) == 0 && !id(weather_storm)));
          p.matrix = fx_sel != 1 && (int32_t) (id(binary_until) - millis()) > 0;
          p.fw_palette = id(fw_palette);
          p.moon_force = preview && (hol == HOL_FULL_MOON || hol == HOL_SUPERMOON || hol == HOL_ECLIPSE) ? hol : 0;
          // Зарево у горизонта: Солнце в пределах ~6° от горизонта, сильнее
          // всего — у самого горизонта. Утром розовое, вечером оранжевое. В
          // дождь, снег и грозу зарева не видно
          const float elev = id(ha_sun_elev).state;
          const int wm = id(weather_mode);
          const bool sky_open = !id(weather_storm) && (wm == 0 || wm >= 5);
          if (fx_sel == 14) {
            p.glow = 1.0f;
          } else if (fx_sel != 1 && sky_open && !std::isnan(elev)) {
            p.glow = std::max(0.0f, 1.0f - std::fabs(elev - 0.5f) / 6.0f);
          }
          {
            auto t = id(ha_time).now();
            p.dawn = t.is_valid() && t.hour < 12;
          }
          // Жара от 30° (гаснет ниже 29°) — марево днём; кот лежит пластом.
          // Сильный мороз (иней) — сосульки и кот в шарфе
          static bool hot = false;
          if (!std::isnan(t_out))
            hot = t_out >= 30.0f || (hot && t_out >= 29.0f);
          p.heat = fx_sel == 13 || (fx_sel != 1 && hot && !id(is_night));
          id(crit)->set_climate(p.heat || (hot && fx_sel != 1) ? 1 : (p.frost ? 2 : 0));
          // Самолёт ночью — изредка; «Фон погоды: Самолёт» — часто
          p.plane = fx_sel == 15 ? 2 : (fx_sel != 1 && id(is_night) ? 1 : 0);
          if (fx_sel == 15)
            p.night = true;
          // «Романтика» (packages/adult.yaml) — свечи по нижнему краю
          p.candles = id(romance_on);
          // Часы убраны (ожидание) или вид «Небо» — небо на весь круг
          p.full = id(clock_hidden) || id(clock_style).active_index().value_or(0) == 0;
          id(wfx)->set_params(p);
          // Кот смотрит в небо — пусть пролетит метеор
          if (id(crit)->take_meteor())
            id(wfx)->launch_meteor();
