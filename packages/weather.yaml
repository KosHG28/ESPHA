# ---------------------------------------------------------------------------
# Погодный фон на странице часов: дождь с брызгами о край экрана (и косой
# при ветре), звёзды ясной ночью, снежинки разной формы,
# град, облака и молнии в грозу. Работает и в приглушённом режиме — при
# гашении экран возвращается на часы, а частицы переходят на яркую палитру,
# чтобы их было видно при низкой яркости панели.
#
# Виджеты — первым слоем страницы часов (weather_fx в packages/ui.yaml),
# поэтому лежат под временем и датой. На других страницах они стоят на месте
# и не тратят ни кадра. Каждая частица — несколько пикселей, облако — около
# 180×70, поэтому за кадр перерисовываются только маленькие области.
#
# Молния — ломаная линия со свечением, мигает дважды. Ярко светится только
# сама молния, яркость экрана она не трогает.
#
# Вид осадков (глобальная weather_mode):
#   0 нет  1 дождь  2 снег  3 мокрый снег (дождь + снег)  4 град
# ---------------------------------------------------------------------------

globals:
  - id: weather_mode
    type: int
    restore_value: false
    initial_value: '0'
  # Сколько частиц: слабые осадки — меньше, сильные — больше
  - id: weather_count
    type: int
    restore_value: false
    initial_value: '0'
  # Сколько облаков (0–3)
  - id: weather_clouds
    type: int
    restore_value: false
    initial_value: '0'
  # Гроза: молнии
  - id: weather_storm
    type: bool
    restore_value: false
    initial_value: 'false'
  # Солнце за горизонтом (по sun.sun; пока его нет — с 21 до 6)
  - id: is_night
    type: bool
    restore_value: false
    initial_value: 'false'
  # Звёзды: ясная ночь
  - id: weather_stars
    type: bool
    restore_value: false
    initial_value: 'false'

text_sensor:
  - platform: homeassistant
    id: ha_weather
    entity_id: ${weather_condition_entity}
    internal: true
    on_value:
      - script.execute: weather_apply
      - script.execute: weather_icon

  # Солнце над горизонтом или нет — отсюда «ночь» для звёзд и иконки луны
  - platform: homeassistant
    id: ha_sun
    entity_id: sun.sun
    internal: true
    on_value:
      - script.execute: update_night
      - script.execute: weather_icon

# Ветер: при нём дождь идёт наискосок, а снег сносит вбок. Направление —
# откуда дует, в градусах, как принято в метеорологии
sensor:
  - platform: homeassistant
    id: ha_wind_speed
    entity_id: ${weather_wind_speed_entity}
    internal: true
  - platform: homeassistant
    id: ha_wind_bearing
    entity_id: ${weather_wind_bearing_entity}
    internal: true

select:
  # «Авто» — по погоде из Home Assistant. Остальные пункты — чтобы проверить
  # эффект, не дожидаясь погоды. Новые пункты добавляются только в конец:
  # сохраняется номер выбранного пункта
  - platform: template
    id: weather_fx_select
    name: Фон погоды
    icon: mdi:weather-snowy-rainy
    entity_category: config
    options: ["Авто", "Выкл", "Дождь", "Снег", "Гроза", "Облачно", "Ясная ночь"]
    initial_option: "Авто"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: weather_apply

script:
  # Пересчитать «ночь» и, если она сменилась, звёзды и иконку. Вызывается
  # при смене sun.sun и раз в минуту из refresh_clock
  - id: update_night
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          bool night;
          if (id(ha_sun).has_state() && !id(ha_sun).state.empty()) {
            night = id(ha_sun).state == "below_horizon";
          } else {
            auto now = id(ha_time).now();
            night = now.is_valid() && (now.hour >= 21 || now.hour < 6);
          }
          static int prev = -1;
          id(is_night) = night;
          if (prev == (int) night)
            return;
          prev = night;
          id(weather_apply)->execute();
          id(weather_icon)->execute();

  # Иконка погоды рядом с уличной температурой. Показывает настоящую погоду,
  # а не пункт «Фона погоды». Ночью — луна вместо солнца
  - id: weather_icon
    mode: restart
    then:
      - lambda: |-
          const std::string s = id(ha_weather).has_state() ? id(ha_weather).state : "";
          bool night = id(is_night);
          const char *icon = "";
          uint32_t color = 0x90A4AE;
          if (s == "clear") { icon = night ? "\U000F0594" : "\U000F0599"; color = night ? 0xB0BEC5 : 0xFFB300; }
          else if (s == "partly_cloudy") { icon = night ? "\U000F0F31" : "\U000F0595"; color = night ? 0xB0BEC5 : 0xFFCA28; }
          else if (s == "cloudy" || s == "overcast") { icon = "\U000F0590"; }
          else if (s == "light_rain" || s == "rain") { icon = "\U000F0597"; color = 0x4FC3F7; }
          else if (s == "heavy_rain" || s == "showers") { icon = "\U000F0596"; color = 0x4FC3F7; }
          else if (s == "sleet") { icon = "\U000F067F"; color = 0x81D4FA; }
          else if (s == "light_snow" || s == "snow") { icon = "\U000F0598"; color = 0xE0E0E0; }
          else if (s == "snowfall") { icon = "\U000F0F36"; color = 0xE0E0E0; }
          else if (s == "hail") { icon = "\U000F0592"; color = 0xCFD8DC; }
          else if (s == "thunderstorm" || s == "thunderstorm_with_hail") { icon = "\U000F0593"; color = 0xFFD54F; }
          else if (s == "thunderstorm_with_rain") { icon = "\U000F067E"; color = 0xFFD54F; }

          // Надпись меняем, только когда иконка правда сменилась: этот скрипт
          // вызывается каждую минуту, а лишняя установка текста — лишняя перерисовка
          static std::string shown = "-";
          lv_obj_t *lbl = id(lbl_weather_icon);
          if (shown != icon) {
            shown = icon;
            lv_label_set_text(lbl, icon);
            lv_obj_set_style_text_color(lbl, lv_color_hex(color), 0);
            if (*icon) lv_obj_clear_flag(lbl, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(lbl, LV_OBJ_FLAG_HIDDEN);
          }

  # Выбрать осадки, облака, грозу и звёзды по погоде и настройке «Фон погоды»
  - id: weather_apply
    mode: restart
    then:
      - lambda: |-
          // Номер пункта «Фона погоды»:
          // 0 Авто, 1 Выкл, 2 Дождь, 3 Снег, 4 Гроза, 5 Облачно, 6 Ясная ночь
          size_t sel = id(weather_fx_select).active_index().value_or(0);
          std::string s;
          switch (sel) {
            case 0: s = id(ha_weather).has_state() ? id(ha_weather).state : ""; break;
            case 2: s = "rain"; break;
            case 3: s = "snow"; break;
            case 4: s = "thunderstorm_with_rain"; break;
            case 5: s = "cloudy"; break;
            case 6: s = "clear"; break;
            default: s = ""; break;
          }
          // Звёзды — ясной или малооблачной ночью. «Ясная ночь» показывает их и днём
          id(weather_stars) = (s == "clear" || s == "partly_cloudy") && (id(is_night) || sel == 6);
          int mode = 0, cnt = 0, clouds = 0;
          bool storm = false;
          if (s == "partly_cloudy") { clouds = 1; }
          else if (s == "cloudy") { clouds = 2; }
          else if (s == "overcast") { clouds = 3; }
          // В дождь и снег облаков нет — только сами осадки
          else if (s == "light_rain") { mode = 1; cnt = 8; }
          else if (s == "rain") { mode = 1; cnt = 12; }
          else if (s == "heavy_rain" || s == "showers") { mode = 1; cnt = 16; }
          else if (s == "sleet") { mode = 3; cnt = 12; }
          else if (s == "light_snow") { mode = 2; cnt = 8; }
          else if (s == "snow") { mode = 2; cnt = 12; }
          else if (s == "snowfall") { mode = 2; cnt = 16; }
          else if (s == "hail") { mode = 4; cnt = 12; }
          else if (s == "thunderstorm") { storm = true; clouds = 3; }
          else if (s == "thunderstorm_with_rain") { mode = 1; cnt = 12; clouds = 3; storm = true; }
          else if (s == "thunderstorm_with_hail") { mode = 4; cnt = 12; clouds = 3; storm = true; }
          id(weather_mode) = mode;
          id(weather_count) = cnt;
          id(weather_clouds) = clouds;
          id(weather_storm) = storm;

interval:
  - interval: ${weather_fx_interval}
    then:
      - lambda: |-
          static const int ND = 16, NF = 16, NS = 8, NC = 3, NST = 12;
          static float dx[ND], dy[ND];                    // капли и градины
          static float fx[NF], fy[NF], fph[NF];           // снежинки
          static float sx[NS], sy[NS], svx[NS], svy[NS];  // брызги
          static int slife[NS];
          static float cx[NC];                            // облака
          static float stph[NST];                         // фазы мерцания звёзд
          static int tick = 0;
          static const int CLOUD_Y[NC] = {34, 78, 18};
          static int applied = -1, nd = 0, nf = 0, ncl = 0;
          static bool storm = false, hail = false, stars = false;
          // Молния
          static lv_point_precise_t bolt_pts[10];
          static uint32_t next_strike = 0, strike_t0 = 0;
          static bool striking = false, bolt_on = false;

          lv_obj_t *root = id(weather_fx);
          lv_obj_t *drops = id(fx_drops), *flakes = id(fx_flakes), *splash = id(fx_splash);
          lv_obj_t *clouds = id(fx_clouds), *starbox = id(fx_stars);
          lv_obj_t *bolt = id(fx_bolt)->obj, *glow = id(fx_bolt_glow)->obj;

          auto rnd = [](int lo, int hi) { return lo + (int) (random_uint32() % (uint32_t) (hi - lo)); };
          auto show = [](lv_obj_t *o, bool v) {
            if (v) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          auto end_strike = [&]() {
            if (!striking) return;
            striking = false;
            bolt_on = false;
            show(bolt, false);
            show(glow, false);
            next_strike = millis() + rnd(5000, 15000);
          };

          // ---- Смена погоды или режима яркости: настроить виджеты ----
          int mode = id(weather_mode);
          int cnt = std::min(id(weather_count), 16);
          int dim = id(screen_dimmed) ? 1 : 0;
          int sig = mode | (cnt << 4) | (id(weather_clouds) << 10) | ((id(weather_storm) ? 1 : 0) << 12) | (dim << 13) |
                    ((id(weather_stars) ? 1 : 0) << 14);
          if (sig != applied) {
            // Если поменялась только яркость — перекрашиваем, но не перемешиваем
            bool relayout = applied < 0 || (sig & ~(1 << 13)) != (applied & ~(1 << 13));
            applied = sig;
            hail = mode == 4;
            nd = (mode == 1 || mode == 4) ? cnt : (mode == 3 ? cnt / 2 : 0);
            nf = mode == 2 ? cnt : (mode == 3 ? cnt / 2 : 0);
            ncl = std::min(id(weather_clouds), NC);
            storm = id(weather_storm);
            stars = id(weather_stars);
            if (!storm) end_strike();
            show(root, nd || nf || ncl || storm || stars);

            // Звёзды — в верхней половине круга, вокруг и выше времени
            for (int i = 0; i < NST; i++) {
              lv_obj_t *p = lv_obj_get_child(starbox, i);
              if (!stars) { show(p, false); continue; }
              if (relayout) {
                int x, y;
                do {
                  x = rnd(50, 416);
                  y = rnd(30, 220);
                } while ((x - 233) * (x - 233) + (y - 233) * (y - 233) > 215 * 215);
                lv_obj_set_pos(p, x, y);
                stph[i] = rnd(0, 628) / 100.0f;
              }
              show(p, true);
            }

            // В приглушённом режиме палитра ярче: при низкой яркости панели
            // тёмные частицы сливаются с чёрным
            uint32_t c_drop = hail ? (dim ? 0xFFFFFF : 0xCFD8DC) : (dim ? 0x7FD4FF : 0x2A6F99);
            for (int i = 0; i < ND; i++) {
              lv_obj_t *p = lv_obj_get_child(drops, i);
              if (i >= nd) { show(p, false); continue; }
              if (hail) { lv_obj_set_size(p, 5, 5); lv_obj_set_style_radius(p, 3, 0); }
              else { lv_obj_set_size(p, 2, 16); lv_obj_set_style_radius(p, 1, 0); }
              lv_obj_set_style_bg_color(p, lv_color_hex(c_drop), 0);
              if (relayout) { dx[i] = rnd(40, 426); dy[i] = rnd(0, 440); }
              lv_obj_set_pos(p, (int) dx[i], (int) dy[i]);
              show(p, true);
            }
            // Нечётные снежинки крупные и яркие — «близко»,
            // чётные мелкие и тусклые — «далеко»
            for (int i = 0; i < NF; i++) {
              lv_obj_t *p = lv_obj_get_child(flakes, i);
              if (i >= nf) { show(p, false); continue; }
              bool big = i % 2;
              uint32_t c = big ? (dim ? 0xFFFFFF : 0x9AA4AE) : (dim ? 0xAEB8C2 : 0x59636D);
              lv_obj_set_style_text_color(p, lv_color_hex(c), 0);
              if (relayout) { fx[i] = rnd(30, 430); fy[i] = rnd(0, 440); fph[i] = rnd(0, 628) / 100.0f; }
              lv_obj_set_pos(p, (int) fx[i], (int) fy[i]);
              show(p, true);
            }
            for (int i = 0; i < NS; i++) {
              lv_obj_t *p = lv_obj_get_child(splash, i);
              lv_obj_set_style_bg_color(p, lv_color_hex(dim ? 0x7FD4FF : 0x2A6F99), 0);
              slife[i] = 0;
              show(p, false);
            }
            // Свечение молнии: в приглушённом режиме ярче
            lv_obj_set_style_line_color(glow, lv_color_hex(dim ? 0xFFC107 : 0xFF9800), 0);

            // Облака: при пасмурной погоде и грозе — темнее
            bool heavy = ncl >= 3 || storm;
            uint32_t c_cloud = heavy ? (dim ? 0x3A4452 : 0x161B21) : (dim ? 0x465262 : 0x1D232A);
            for (int i = 0; i < NC; i++) {
              lv_obj_t *c = lv_obj_get_child(clouds, i);
              if (i >= ncl) { show(c, false); continue; }
              for (uint32_t k = 0; k < lv_obj_get_child_count(c); k++)
                lv_obj_set_style_bg_color(lv_obj_get_child(c, k), lv_color_hex(c_cloud), 0);
              if (relayout) cx[i] = 40 + i * 150 - 90;
              lv_obj_set_pos(c, (int) cx[i], CLOUD_Y[i]);
              show(c, true);
            }
          }

          // ---- Анимация: только пока открыты часы и экран не выключен ----
          bool any = nd || nf || ncl || storm || stars;
          if (!any || id(current_page) != 0 || id(screen_off)) {
            end_strike();
            return;
          }
          tick++;

          // Ветер: -1…1, плюс — сносит вправо. Направление в метеорологии —
          // откуда дует, поэтому западный ветер (270°) несёт осадки вправо.
          // Полный снос — при 15 м/с и сильнее
          float wind = 0;
          float ws = id(ha_wind_speed).state, wb = id(ha_wind_bearing).state;
          if (!std::isnan(ws) && !std::isnan(wb))
            wind = -sinf(wb * 0.0174533f) * std::min(ws, 15.0f) / 15.0f;
          auto wrap_x = [](float x) {
            if (x < 20) return x + 426;
            if (x > 446) return x - 426;
            return x;
          };

          // Звёзды мерцают: яркость меняется по синусу, у каждой свой ритм.
          // Раз в 4 кадра (200 мс) — чаще глаз не заметит, а перерисовок меньше
          if (stars && (tick % 4) == 0) {
            for (int i = 0; i < NST; i++) {
              stph[i] += 0.25f + (i % 4) * 0.07f;
              float k = 0.35f + 0.65f * (0.5f + 0.5f * sinf(stph[i]));
              int hi = dim ? 0xFF : 0xC8;
              int v = (int) (hi * k);
              lv_obj_set_style_bg_color(lv_obj_get_child(starbox, i), lv_color_make(v, v, std::min(255, v + 16)), 0);
            }
          }

          // Капля разбивается о нижний край круглого экрана
          auto ground = [](float x) {
            float d = x - 233.0f;
            return 233.0f + sqrtf(std::max(0.0f, 233.0f * 233.0f - d * d)) - 8.0f;
          };

          for (int i = 0; i < nd; i++) {
            dy[i] += hail ? 7.0f + (i % 3) : 12.0f + (i % 3) * 2.0f;
            dx[i] = wrap_x(dx[i] + wind * (hail ? 3.0f : 5.0f));
            float h = hail ? 5.0f : 16.0f;
            float g = ground(dx[i] + 1);
            if (dy[i] + h > g) {
              // Брызги: две точки разлетаются вверх в стороны (не у каждой капли)
              if (!hail && (random_uint32() % 10) < 6) {
                int made = 0;
                for (int k = 0; k < NS && made < 2; k++) {
                  if (slife[k]) continue;
                  sx[k] = dx[i];
                  sy[k] = g - 3;
                  svx[k] = made ? 1.3f : -1.3f;
                  svy[k] = -2.2f;
                  slife[k] = 5;
                  lv_obj_t *p = lv_obj_get_child(splash, k);
                  lv_obj_set_pos(p, (int) sx[k], (int) sy[k]);
                  show(p, true);
                  made++;
                }
              }
              dx[i] = rnd(40, 426);
              dy[i] = -18 - rnd(0, 60);
            }
            lv_obj_set_pos(lv_obj_get_child(drops, i), (int) dx[i], (int) dy[i]);
          }

          for (int k = 0; k < NS; k++) {
            if (!slife[k]) continue;
            lv_obj_t *p = lv_obj_get_child(splash, k);
            if (--slife[k] == 0) { show(p, false); continue; }
            sx[k] += svx[k];
            sy[k] += svy[k];
            svy[k] += 0.7f;
            lv_obj_set_pos(p, (int) sx[k], (int) sy[k]);
          }

          // Снежинки: крупные падают быстрее и качаются сильнее — так
          // получается глубина. У каждой свой ритм покачивания
          for (int i = 0; i < nf; i++) {
            bool big = i % 2;
            fy[i] += big ? 1.7f + (i % 3) * 0.25f : 0.8f + (i % 3) * 0.2f;
            fph[i] += (big ? 0.07f : 0.05f) + i * 0.003f;
            fx[i] = wrap_x(fx[i] + cosf(fph[i]) * (big ? 0.8f : 0.45f) + wind * (big ? 1.4f : 0.9f));
            if (fy[i] > 470) {
              fy[i] = -30 - rnd(0, 40);
              fx[i] = rnd(30, 430);
            }
            lv_obj_set_pos(lv_obj_get_child(flakes, i), (int) fx[i], (int) fy[i]);
          }

          // Облака медленно ползут вправо, у каждого своя скорость
          for (int i = 0; i < ncl; i++) {
            cx[i] += 0.25f + i * 0.08f;
            if (cx[i] > 466) cx[i] = -190;
            lv_obj_set_pos(lv_obj_get_child(clouds, i), (int) cx[i], CLOUD_Y[i]);
          }

          // ---- Молния ----
          if (!storm)
            return;
          uint32_t now = millis();
          if (!striking) {
            if (next_strike == 0)
              next_strike = now + rnd(2000, 6000);
            if ((int32_t) (now - next_strike) < 0)
              return;
            // Начало — из-под облака, если оно на экране, иначе сверху
            int x0 = rnd(130, 336), y0 = 40;
            for (int i = 0; i < ncl; i++) {
              int mid = (int) cx[i] + 90;
              if (mid > 120 && mid < 346) { x0 = mid; y0 = CLOUD_Y[i] + 50; break; }
            }
            int n = 7 + rnd(0, 4);
            float step = rnd(170, 250) / (float) (n - 1);
            float x = 0, minx = 0;
            for (int k = 0; k < n; k++) {
              if (k) x += rnd(-24, 25);
              bolt_pts[k].x = x;
              bolt_pts[k].y = k * step;
              minx = std::min(minx, x);
            }
            // Сдвинуть точки так, чтобы слева остался отступ под толщину свечения
            for (int k = 0; k < n; k++)
              bolt_pts[k].x -= minx - 6;
            lv_line_set_points(bolt, bolt_pts, n);
            lv_line_set_points(glow, bolt_pts, n);
            int px = x0 + (int) minx - 6;
            lv_obj_set_pos(bolt, px, y0);
            lv_obj_set_pos(glow, px, y0);
            striking = true;
            strike_t0 = now;
          }
          // Два всполоха: 0–80 мс и 160–300 мс
          uint32_t t = now - strike_t0;
          if (t >= 300) {
            end_strike();
            return;
          }
          bool on = t < 80 || t >= 160;
          if (on != bolt_on) {
            bolt_on = on;
            show(glow, on);
            show(bolt, on);
          }
