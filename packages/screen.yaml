# ---------------------------------------------------------------------------
# Управление яркостью AMOLED и автогашение экрана.
# У AMOLED нет подсветки: яркость задаётся командой контроллера (регистр 0x51),
# поэтому используем display->set_brightness() вместо light/ledc.
# ---------------------------------------------------------------------------

number:
  - platform: template
    id: screen_brightness
    name: Яркость экрана
    icon: mdi:brightness-6
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 70
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: wake_screen

  - platform: template
    id: screen_dim
    name: Яркость в режиме ожидания
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 10
    optimistic: true
    restore_value: true
    # Если экран сейчас приглушён — применить новую яркость сразу
    on_value:
      - script.execute: apply_dim

  - platform: template
    id: screen_timeout
    name: Гасить экран через
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 600
    step: 10
    initial_value: 60
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: wake_screen

  # Ночное выключение: с какого и до какого часа экран гаснет полностью
  - platform: template
    id: night_from
    name: "Ночь: гасить экран с"
    icon: mdi:weather-night
    entity_category: config
    unit_of_measurement: ч
    min_value: 0
    max_value: 23
    step: 1
    initial_value: ${night_off_from}
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: power_eval

  - platform: template
    id: night_to
    name: "Ночь: гасить экран до"
    icon: mdi:weather-sunset-up
    entity_category: config
    unit_of_measurement: ч
    min_value: 0
    max_value: 23
    step: 1
    initial_value: ${night_off_to}
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: power_eval

select:
  # Вид страницы часов. «Небо» — и днём так же, как в ожидании: без цифр
  # времени, погода на улице слева по центру, небо на весь круг (созвездие,
  # планеты, солнце с лучами). «Часы» — прежний вид с крупным временем
  - platform: template
    id: clock_style
    name: Вид страницы часов
    icon: mdi:weather-night
    entity_category: config
    options: ["Небо", "Часы"]
    initial_option: "Небо"
    optimistic: true
    restore_value: true

switch:
  # В режиме ожидания: экран на обычной яркости, погодные эффекты горят
  # в полную силу, а надписи на часах — полупрозрачные, чтобы выглядели так же
  # тускло, как при «Яркости в режиме ожидания»
  - platform: template
    id: sw_fx_bright
    name: Яркие эффекты в ожидании
    icon: mdi:weather-lightning-rainy
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: apply_dim
    on_turn_off:
      - script.execute: apply_dim

  # Цифры времени на странице часов. Выключить — часов нет совсем, а погода
  # на улице переезжает в центр. Применяет интервал ниже (packages/screen.yaml)
  - platform: template
    id: sw_clock
    name: Часы на экране
    icon: mdi:clock-digital
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # В режиме ожидания часы уходят с экрана: остаются погода на улице, кот и
  # эффекты. Касание или движение — часы возвращаются
  - platform: template
    id: sw_hide_clock_idle
    name: Прятать часы в ожидании
    icon: mdi:clock-remove-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: apply_dim
    on_turn_off:
      - script.execute: apply_dim

  # Ночью (солнце за горизонтом) цифры времени тёплого янтарного цвета —
  # меньше режут глаза в темноте
  - platform: template
    id: sw_warm_night
    name: Тёплые часы ночью
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: clock_colors
    on_turn_off:
      - script.execute: clock_colors

  - platform: template
    id: sw_night_off
    name: Гасить экран ночью
    icon: mdi:power-sleep
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: power_eval
    on_turn_off:
      - script.execute: power_eval

  - platform: template
    id: sw_away_off
    name: Гасить экран, когда никого нет
    icon: mdi:home-export-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: power_eval
    on_turn_off:
      - script.execute: power_eval

sensor:
  # Сколько людей в зоне «Дом». 0 — никого: через away_off_delay экран
  # гаснет полностью. Кто-то вернулся — включается сразу
  - platform: homeassistant
    id: ha_people_home
    entity_id: zone.home
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return !std::isnan(x) && x < 0.5f;'
          then:
            # mode: single — таймер не перезапускается от повторных нулей
            - script.execute: away_timer
          else:
            - script.stop: away_timer
            - lambda: 'id(nobody_home) = false;'
            - script.execute: power_eval
      # Кто-то пришёл или ушёл — показать или спрятать значок поилки
      - script.execute: pet_alert_eval

globals:
  # Экран приглушён по таймауту. По нему погодный фон берёт яркую палитру
  - id: screen_dimmed
    type: bool
    restore_value: false
    initial_value: 'false'
  # Экран выключен полностью: яркость 0, отрисовка LVGL на паузе
  - id: screen_off
    type: bool
    restore_value: false
    initial_value: 'false'
  # Сейчас ночь или никого нет — экран должен быть выключен, когда его не трогают
  - id: off_wanted
    type: bool
    restore_value: false
    initial_value: 'false'
  # Дома никого уже дольше away_off_delay
  - id: nobody_home
    type: bool
    restore_value: false
    initial_value: 'false'
  # Пока экран был выключен, у принтера что-то произошло — показать при включении
  - id: printer_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  # Яркость, которая сейчас выставлена панели (0..255), — от неё идёт плавный
  # переход. 180 — яркость из настройки дисплея при запуске
  - id: bri_now
    type: int
    restore_value: false
    initial_value: '180'
  # Часы убраны с экрана (режим ожидания, «Прятать часы в ожидании»)
  - id: clock_hidden
    type: bool
    restore_value: false
    initial_value: 'false'
  # За сколько миллисекунд разгораться при пробуждении
  - id: wake_fade_ms
    type: int
    restore_value: false
    initial_value: '200'

script:
  # Полная яркость, затем — через screen_timeout секунд — приглушение.
  # mode: restart => каждое касание перезапускает таймер.
  - id: wake_screen
    mode: restart
    then:
      # Горит ночник или включена «Романтика» — они сами решают, когда
      # вернуть обычный экран
      - if:
          condition:
            lambda: 'return id(nightlight_on) || id(romance_on);'
          then:
            - script.stop: wake_screen
      # Разбудили посреди плавного гашения — не доводить его до конца
      - script.stop: screen_sleep
      # Проснулись из ожидания — часы возвращаются (из полной темноты их
      # покажет wake_reveal)
      - lambda: |-
          if (id(clock_hidden) && !id(screen_off))
            id(clock_anim)->execute(true, false);
      # Из полной темноты экран разгорается дольше — вместе с раскрытием
      # «зрачка», из ожидания — быстро
      - lambda: 'id(wake_fade_ms) = id(screen_off) ? 550 : 220;'
      # Экран был выключен полностью — возобновить отрисовку. Если за это
      # время у принтера что-то произошло, сразу открыть его страницу
      - if:
          condition:
            lambda: 'return id(screen_off);'
          then:
            - lambda: 'id(screen_off) = false;'
            - lvgl.resume:
            - if:
                condition:
                  lambda: 'return id(printer_pending);'
                then:
                  - lambda: 'id(printer_pending) = false;'
                  - if:
                      condition:
                        lambda: 'return !id(page_printer)->skip;'
                      then:
                        - lvgl.page.show:
                            id: page_printer
            - script.execute: wake_reveal
      # Плавно к полной яркости; надписи на часах снова непрозрачные (в
      # ожидании могли быть приглушены)
      - lambda: |-
          id(screen_dimmed) = false;
          const float pct = id(screen_brightness).state;
          id(fade_screen)->execute((int) (pct * 2.55f + 0.5f), 255, id(wake_fade_ms));
      - if:
          condition:
            lambda: 'return id(screen_timeout).state > 0;'
          then:
            - delay: !lambda 'return (uint32_t) (id(screen_timeout).state * 1000);'
            # Пока на экране сообщение из HA, не гасить — дождаться, пока оно
            # уйдёт (по таймеру или касанием)
            - wait_until:
                condition:
                  not:
                    script.is_running: show_message
            # В простое возвращаемся на часы: на AMOLED это и меньше
            # горящих пикселей, и понятнее, что панель просто спит
            - lvgl.page.show:
                id: page_clock
            # Ночью или когда никого нет — не приглушать, а выключить совсем
            - if:
                condition:
                  lambda: 'return id(off_wanted);'
                then:
                  - script.execute: screen_sleep
                else:
                  - lambda: 'id(screen_dimmed) = true;'
                  - script.execute: apply_dim

  # Приглушить экран для режима ожидания. Обычно — просто яркость ожидания.
  # С «Яркими эффектами в ожидании» — экран на обычной яркости, а надписи
  # часов прозрачнее ровно во столько раз, во сколько яркость ожидания ниже
  # обычной: часы выглядят так же тускло, а погодные эффекты — ярко.
  # Если яркость ожидания 0 % — экран тёмный, как без этой настройки
  - id: apply_dim
    mode: restart
    then:
      - lambda: |-
          if (!id(screen_dimmed) || id(screen_off))
            return;
          // Часы уходят с экрана — или возвращаются, если это выключили
          id(clock_anim)->execute(!id(sw_hide_clock_idle).state, false);
          float full = id(screen_brightness).state;
          float dim = std::min(id(screen_dim).state, full);
          // Затухает плавно, за секунду
          if (id(sw_fx_bright).state && dim > 0 && full > dim) {
            float k = std::max(0.08f, dim / full);
            id(fade_screen)->execute((int) (full * 2.55f + 0.5f), (int) (k * 255.0f + 0.5f), 1000);
          } else {
            id(fade_screen)->execute((int) (dim * 2.55f + 0.5f), 255, 1000);
          }

  # Выключить экран полностью: яркость 0 — пиксели AMOLED не горят вовсе,
  # и отрисовка на паузе — погодный фон и прочее не считаются впустую.
  # Будит касание, движение, кнопка BOOT или конец ночи / чьё-то возвращение
  - id: screen_sleep
    mode: single
    then:
      # Сначала плавно гаснет, и только потом отрисовка встаёт на паузу —
      # на паузе переход не шёл бы
      - lambda: |-
          id(screen_off) = true;
          id(screen_dimmed) = true;
          id(fade_screen)->execute(0, (int) lv_obj_get_style_text_opa(id(root_clock), LV_PART_MAIN), 600);
      - delay: 650ms
      - lambda: |-
          id(bri_now) = 0;
          id(amoled)->set_brightness(0);
      - lvgl.pause:

  # Пробуждение из полной темноты: картинка раскрывается от центра к краям,
  # как зрачок, — чёрное кольцо на верхнем слое сужается к краю круга. На
  # часах надписи появляются по очереди и чуть всплывают: сначала время,
  # затем погода, строка солнца и комнатная температура
  - id: wake_reveal
    mode: restart
    then:
      - lambda: |-
          static lv_obj_t *iris = nullptr;
          if (!iris) {
            iris = lv_obj_create(lv_display_get_layer_top(lv_display_get_default()));
            lv_obj_remove_style_all(iris);
            lv_obj_set_size(iris, 466, 466);
            lv_obj_set_pos(iris, 0, 0);
            lv_obj_set_style_radius(iris, LV_RADIUS_CIRCLE, 0);
            lv_obj_set_style_border_color(iris, lv_color_black(), 0);
            lv_obj_set_style_border_opa(iris, LV_OPA_COVER, 0);
            lv_obj_clear_flag(iris, LV_OBJ_FLAG_CLICKABLE);
          }
          lv_obj_move_foreground(iris);
          lv_obj_clear_flag(iris, LV_OBJ_FLAG_HIDDEN);
          lv_anim_delete(iris, nullptr);
          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, iris);
          lv_anim_set_values(&a, 233, 0);
          lv_anim_set_duration(&a, 550);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
          lv_anim_set_early_apply(&a, true);
          lv_anim_set_exec_cb(&a, [](void *o, int32_t v) {
            lv_obj_set_style_border_width((lv_obj_t *) o, v, 0);
          });
          lv_anim_set_completed_cb(&a, [](lv_anim_t *an) {
            lv_obj_add_flag((lv_obj_t *) an->var, LV_OBJ_FLAG_HIDDEN);
          });
          lv_anim_start(&a);

          // Каскад надписей часов (если открыта другая страница — часы
          // просто возвращаются на место без анимации)
          id(clock_anim)->execute(true, true);

  # Часы уходят с экрана и возвращаются — каскадом.
  # Уход (show = false): сначала тают нижние строки, последними — цифры:
  # часы уезжают влево, минуты вправо.
  # Возвращение (show = true): наоборот — цифры съезжаются к центру, следом
  # поднимаются строки снизу.
  # Погода на улице не уходит никогда; цифры — только если «Часы на экране».
  # force — играть появление, даже если надпись уже видна (пробуждение из
  # темноты). Не на странице часов — сразу, без анимации
  - id: clock_anim
    parameters:
      show: bool
      force: bool
    mode: queued
    max_runs: 3
    then:
      - lambda: |-
          id(clock_hidden) = !show;
          // «Небо» — и в активном режиме всё как в ожидании: без цифр и
          // нижних строк; значок двери и огонёк намёка — только в активном
          const bool sky = id(clock_style).active_index().value_or(0) == 0;
          const bool active = show;
          enum Kind : uint8_t { PLAIN, DIGITS, OUTSIDE, EXTRA };
          struct Step {
            lv_obj_t *obj;
            int dx, dy;
            uint16_t in_ms, out_ms;  // задержка при появлении и при уходе
            Kind kind;
          };
          const Step steps[] = {
              {id(lbl_time_h), -26, 0, 40, 240, DIGITS},
              {id(lbl_time_m), 26, 0, 40, 240, DIGITS},
              {id(lbl_binary), 0, 0, 40, 240, DIGITS},
              {lv_obj_get_parent(id(lbl_slot1)), 0, -16, 150, 150, OUTSIDE},
              {id(lbl_door), 0, -16, 150, 150, EXTRA},
              {id(lbl_hint), 0, 0, 200, 0, EXTRA},
              {id(lbl_wstatus), 0, 14, 220, 100, PLAIN},
              {id(lbl_sun), 0, 14, 280, 50, PLAIN},
              {id(lbl_slot2), 0, 14, 340, 0, PLAIN},
          };
          // Что сейчас показано (или куда уже едет) — чтобы не повторять
          static bool shown[sizeof(steps) / sizeof(steps[0])] = {true, true, true, true, true, true, true, true, true};
          const bool instant = id(current_page) != 0;
          for (size_t i = 0; i < sizeof(steps) / sizeof(steps[0]); i++) {
            const Step &st = steps[i];
            bool want = active && !sky;
            if (st.kind == DIGITS && !id(sw_clock).state)
              want = false;
            if (st.kind == OUTSIDE)
              want = true;
            if (st.kind == EXTRA)
              want = active;
            if (shown[i] == want && !(force && want))
              continue;
            shown[i] = want;
            const bool show = want;
            lv_anim_delete(st.obj, nullptr);
            if (instant) {
              lv_obj_set_style_opa(st.obj, show ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
              lv_obj_set_style_translate_x(st.obj, 0, 0);
              lv_obj_set_style_translate_y(st.obj, 0, 0);
              continue;
            }
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, st.obj);
            // Сдвиг и направление — в user_data: dx, dy (по байту) и флаг
            const uintptr_t ud = ((uintptr_t) (uint8_t) (int8_t) st.dx) | ((uintptr_t) (uint8_t) (int8_t) st.dy << 8) |
                                 (show ? 0x10000 : 0);
            lv_anim_set_user_data(&a, (void *) ud);
            lv_anim_set_values(&a, 0, 256);
            lv_anim_set_duration(&a, show ? 480 : 560);
            lv_anim_set_delay(&a, show ? st.in_ms : st.out_ms);
            lv_anim_set_path_cb(&a, show ? lv_anim_path_ease_out : lv_anim_path_ease_in);
            lv_anim_set_early_apply(&a, show);
            lv_anim_set_custom_exec_cb(&a, [](lv_anim_t *an, int32_t v) {
              const uintptr_t u = (uintptr_t) lv_anim_get_user_data(an);
              const int dx = (int8_t) (u & 0xFF), dy = (int8_t) ((u >> 8) & 0xFF);
              // p — насколько надпись на месте: 256 — видна, 0 — ушла
              const int p = (u & 0x10000) ? v : 256 - v;
              auto *o = (lv_obj_t *) an->var;
              lv_obj_set_style_opa(o, (lv_opa_t) (p >= 256 ? 255 : p), 0);
              lv_obj_set_style_translate_x(o, dx * (256 - p) / 256, 0);
              lv_obj_set_style_translate_y(o, dy * (256 - p) / 256, 0);
            });
            lv_anim_start(&a);
          }
          // Погода на улице: наверху; без цифр — в центре; в ожидании —
          // слева по центру, а остальное небо — созвездию (weather_fx,
          // Params::full)
          lv_obj_t *row = lv_obj_get_parent(id(lbl_slot1));
          static int32_t rx0, ry0, rx1, ry1;
          const bool left = !active || sky;
          const int32_t x1 = left ? -140 : 0;
          const int32_t y1 = left ? 0 : (id(sw_clock).state ? -100 : -12);
          const int32_t x0 = lv_obj_get_x_aligned(row), y0 = lv_obj_get_y_aligned(row);
          lv_anim_delete(&rx0, nullptr);
          if (force || instant) {
            lv_obj_set_pos(row, x1, y1);
          } else if (x0 != x1 || y0 != y1) {
            rx0 = x0;
            ry0 = y0;
            rx1 = x1;
            ry1 = y1;
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, &rx0);
            lv_anim_set_values(&a, 0, 256);
            lv_anim_set_duration(&a, 700);
            // В ожидание — когда цифры начали уходить; обратно — сразу
            lv_anim_set_delay(&a, left ? 200 : 0);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
            lv_anim_set_exec_cb(&a, [](void *, int32_t v) {
              lv_obj_set_pos(lv_obj_get_parent(id(lbl_slot1)), rx0 + (rx1 - rx0) * v / 256, ry0 + (ry1 - ry0) * v / 256);
            });
            lv_anim_start(&a);
          }

  # «Часы на экране» или «Вид страницы часов» переключили: цифры уходят или
  # возвращаются, погода на улице переезжает
  - id: clock_layout
    mode: restart
    then:
      - lambda: 'id(clock_anim)->execute(!id(clock_hidden), false);'

  # Цвет цифр времени: ночью с «Тёплыми часами» — янтарный, иначе обычный.
  # Без связи с HA цифры серые (их красит behaviour.yaml) — не трогаем
  - id: clock_colors
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          if (!api::global_api_server->is_connected())
            return;
          const bool warm = id(sw_warm_night).state && id(is_night);
          // Хэллоуин — оранжевые цифры, как тыква
          if (id(holiday) == weather_fx::HOL_HALLOWEEN) {
            lv_obj_set_style_text_color(id(lbl_time_h), lv_color_hex(0xFF8C1A), 0);
            lv_obj_set_style_text_color(id(lbl_time_m), lv_color_hex(0xFFB347), 0);
            return;
          }
          lv_obj_set_style_text_color(id(lbl_time_h), lv_color_hex(warm ? 0xFFD2A0 : 0xFFFFFF), 0);
          lv_obj_set_style_text_color(id(lbl_time_m), lv_color_hex(warm ? 0xDDA66A : ${time_minutes_color}), 0);

  # Плавный переход яркости панели (bri, 0..255) и прозрачности надписей на
  # часах (opa, 0..255) за ms миллисекунд. Идёт анимацией LVGL, в такт с
  # перерисовкой экрана
  - id: fade_screen
    parameters:
      bri: int
      opa: int
      ms: int
    mode: restart
    then:
      - lambda: |-
          // Яркость меняется равномерно для глаза, а не для панели: глаз
          // чувствует яркость примерно как степень 1/2.2, поэтому переход идёт
          // по «светлоте», а в панель уходит её степень 2.2. Иначе в начале
          // разгорания экран словно вспыхивает, а в конце почти не меняется
          struct Fade {
            int b0, b1, o0, o1;
            float l0, l1;
          };
          static Fade f;
          lv_anim_delete(&f, nullptr);
          f.b0 = id(bri_now);
          f.b1 = std::max<int>(0, std::min<int>(255, bri));
          f.o0 = lv_obj_get_style_text_opa(id(root_clock), LV_PART_MAIN);
          f.o1 = std::max<int>(0, std::min<int>(255, opa));
          if (f.b0 == f.b1 && f.o0 == f.o1)
            return;
          f.l0 = powf(f.b0 / 255.0f, 1.0f / 2.2f);
          f.l1 = powf(f.b1 / 255.0f, 1.0f / 2.2f);
          auto step = [](void *var, int32_t v) {
            auto *p = (Fade *) var;
            const float l = p->l0 + (p->l1 - p->l0) * v / 256.0f;
            const int b = v >= 256 ? p->b1 : (int) (255.0f * powf(l, 2.2f) + 0.5f);
            const int o = p->o0 + (p->o1 - p->o0) * v / 256;
            if (b != id(bri_now)) {
              id(bri_now) = b;
              id(amoled)->set_brightness((uint8_t) b);
            }
            if (o != lv_obj_get_style_text_opa(id(root_clock), LV_PART_MAIN))
              lv_obj_set_style_text_opa(id(root_clock), (lv_opa_t) o, 0);
          };
          if (ms <= 0) {
            step(&f, 256);
            return;
          }
          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, &f);
          lv_anim_set_values(&a, 0, 256);
          lv_anim_set_duration(&a, ms);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
          lv_anim_set_exec_cb(&a, step);
          lv_anim_start(&a);

  # Дома никого: подождать away_off_delay — вдруг это сбой геопозиции или
  # вы вышли на пару минут — и только тогда считать, что никого нет
  - id: away_timer
    mode: single
    then:
      - delay: ${away_off_delay}
      - lambda: 'id(nobody_home) = true;'
      - script.execute: power_eval

  # Решить, должен ли экран быть выключен: ночь по расписанию или никого нет
  # дома. Вызывается раз в минуту, при смене людей дома и настроек
  - id: power_eval
    mode: queued
    max_runs: 3
    then:
      - lambda: |-
          bool night = false;
          if (id(sw_night_off).state) {
            auto now = id(ha_time).now();
            int a = (int) id(night_from).state, b = (int) id(night_to).state;
            if (now.is_valid() && a != b)
              night = a < b ? (now.hour >= a && now.hour < b) : (now.hour >= a || now.hour < b);
          }
          // Без связи с HA неизвестно, есть ли кто дома, — по этому правилу не гасим
          bool away = id(sw_away_off).state && id(nobody_home) && api::global_api_server->is_connected();
          id(off_wanted) = night || away;
      # Пора выключить: если экран не трогали (таймер гашения уже отработал) —
      # сразу, иначе он выключится сам по окончании таймаута
      - if:
          condition:
            lambda: 'return id(off_wanted) && !id(screen_off);'
          then:
            - if:
                condition:
                  lambda: 'return !id(wake_screen)->is_running() && !id(nightlight_on) && !id(romance_on);'
                then:
                  - script.execute: screen_sleep
      # Ночь кончилась или кто-то пришёл — включить
      - if:
          condition:
            lambda: 'return !id(off_wanted) && id(screen_off);'
          then:
            - script.execute: wake_screen

interval:
  # «Часы на экране»: применить при загрузке и когда переключили. Не в
  # on_turn_on — при загрузке выключатель восстанавливается раньше, чем
  # создан экран
  - interval: 1s
    then:
      - lambda: |-
          static int last = -1;
          const int on = (id(sw_clock).state ? 1 : 0) | (id(clock_style).active_index().value_or(0) << 1);
          if (on == last)
            return;
          last = on;
          id(clock_layout)->execute();
